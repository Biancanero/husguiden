# One independent house guide = one Compose project (own container, own network, own volume).
#   cp deploy/instance.env.example instances/palma.env   # edit passwords, port, which guide
#   docker compose -p palma --env-file instances/palma.env up -d --build
# A thousand guides = a thousand env files and project names on the same image (deploy/new-instance.sh).
services:
  guide:
    build: .
    image: husguiden:latest
    restart: unless-stopped
    environment:
      SITE: ${SITE:-family}
      SEED: ${SEED:-houses/joanmiro87 houses/hulehallar:hamra-}
      PUBLIC: ${PUBLIC:-1}
      OWNER_PASSWORD: ${OWNER_PASSWORD:?set OWNER_PASSWORD in the env file}
      EDITOR_PASSWORD: ${EDITOR_PASSWORD:-}
      GUEST_PASSWORD: ${GUEST_PASSWORD:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      HUSGUIDEN_MODEL: ${HUSGUIDEN_MODEL:-claude-sonnet-5-5}
      EXAMPLE_PRIVATE: ${EXAMPLE_PRIVATE:-}
    ports:
      - "${BIND:-127.0.0.1}:${PORT:-8080}:8080"
    volumes:
      - data:/data
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
volumes:
  data: {}
