services:
  westman:
    build: .
    container_name: westman-intern
    restart: unless-stopped
    ports:
      - "10.108.0.5:80:80"
    read_only: true
    tmpfs:
      - /config
      - /data
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    security_opt:
      - no-new-privileges:true
