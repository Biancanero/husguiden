<!doctype html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
</head>
<body>
<title>Westman exempelportal</title>
<style>
/* Layout: a calm house ledger – thin top bar with the two houses and the four rooms of the site (Översikt, Ekonomi,
   Dokument, Underhåll), content in one centred column up to 1180 px; houses get an image-first page. */
:root {   /* dark is the default (Gustav 20 Oct); light is one click away and remembered per device */
  --paper: #121212; --paper2: #1b1b1b; --card: #181818; --ink: #ececea; --ink2: #c2c2be; --muted: #8b8b86; --line: #2c2c2a;
  --accent: #93b09c; --accent-ink: #b4cdbb; --warn: #d9a066; --bad: #e07d72; --good: #8fbf9c; color-scheme: dark;
  --f: "Akzidenz-Grotesk Pro", "Akzidenz-Grotesk", "Archivo", "Helvetica Neue", Arial, sans-serif; --serif: var(--f);
}
:root[data-theme="light"] {
  --paper: #f2f1ee; --paper2: #e8e6e1; --card: #faf9f7; --ink: #1d1d1b; --ink2: #4f4e4b; --muted: #85837e; --line: #dcd9d3;
  --accent: #5f7d69; --accent-ink: #45604f; --warn: #a8642e; --bad: #a3433a; --good: #4f7a5c; color-scheme: light;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--paper); color: var(--ink); font: 400 15px/1.55 var(--f); -webkit-font-smoothing: antialiased; }
a { color: inherit; }
button, input, select, textarea { font: inherit; color: inherit; }
.wrap { max-width: 1180px; margin: 0 auto; padding-inline: 20px; }
.eyebrow { font-size: 10.5px; font-weight: 500; letter-spacing: .24em; text-transform: uppercase; color: var(--muted); }
h1, h2, h3 { font-family: var(--serif); font-weight: 500; margin: 0; text-wrap: balance; letter-spacing: -.022em; }
h1 { font-size: clamp(34px, 5vw, 54px); line-height: 1.05; }
h2 { font-size: clamp(24px, 3vw, 30px); line-height: 1.15; }
h3 { font-size: 20px; }
.num { font-variant-numeric: tabular-nums; }

/* top bar */
header.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: color-mix(in srgb, var(--paper) 92%, transparent); backdrop-filter: blur(8px); border-bottom: 1px solid var(--line); }
header.top .wrap { display: flex; align-items: center; gap: 22px; height: 58px; }
.brand { font-family: var(--serif); font-size: 21px; text-decoration: none; white-space: nowrap; }
.brand i { font-style: normal; color: var(--accent); }
nav.main { display: flex; gap: 18px; overflow-x: auto; scrollbar-width: none; flex: 1; }
nav.main a { font-size: 11px; font-weight: 500; letter-spacing: .18em; text-transform: uppercase; text-decoration: none; padding: 19px 0 17px; border-bottom: 2px solid transparent; white-space: nowrap; color: var(--ink2); }
nav.main a[aria-current="page"] { border-color: var(--ink); color: var(--ink); }
.who { font-size: 12px; color: var(--muted); white-space: nowrap; }
.who b { font-weight: 500; color: var(--ink2); }

main { padding-block: 34px 90px; display: grid; gap: 40px; }
.hero { display: grid; gap: 8px; }
.hero p { margin: 0; color: var(--ink2); max-width: 62ch; }

/* buttons */
.btn { display: inline-flex; align-items: center; gap: 8px; font-size: 11px; font-weight: 500; letter-spacing: .16em; text-transform: uppercase; padding: 10px 14px; border: 1px solid var(--ink); background: transparent; cursor: pointer; text-decoration: none; white-space: nowrap; }
.btn:hover { background: var(--ink); color: var(--paper); }
.btn.solid { background: var(--ink); color: var(--paper); }
.btn.solid:hover { background: transparent; color: var(--ink); }
.btn.small { padding: 6px 10px; font-size: 10px; }
.btn.ghost { border-color: var(--line); }
.btn.danger { border-color: var(--bad); color: var(--bad); }
.btn.danger:hover { background: var(--bad); color: #fff; }
.btn:focus-visible, a:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible, .chk:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
.spread { display: flex; justify-content: space-between; align-items: end; gap: 14px; flex-wrap: wrap; }

/* house cards */
.houses { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 300px), 1fr)); gap: 26px; }
.objsec { display: grid; gap: 12px; padding-top: 10px; border-top: 1px solid var(--line); }
.binder { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 220px), 1fr)); gap: 0; border-top: 1px solid var(--line); border-left: 1px solid var(--line); }
.binder a { display: grid; grid-template-columns: 1fr auto; gap: 2px 12px; padding: 18px 20px; border-right: 1px solid var(--line); border-bottom: 1px solid var(--line); text-decoration: none; color: var(--ink); }
.binder a:hover { background: var(--card); }
.binder b { font-family: var(--serif); font-weight: 400; font-size: 24px; }
.binder span { grid-column: 1; font-size: 12px; color: var(--muted); }
.binder i { grid-row: 1 / span 2; grid-column: 2; align-self: center; font-style: normal; color: var(--muted); }
.hcard { text-decoration: none; display: grid; gap: 12px; }
.hcard .ph { aspect-ratio: 16 / 10; overflow: hidden; background: var(--paper2); }
.hcard img { width: 100%; height: 100%; object-fit: cover; display: block; transition: transform .6s ease; }
.hcard:hover img { transform: scale(1.025); }
.hcard .meta { display: flex; justify-content: space-between; gap: 12px; align-items: baseline; }
.hcard .meta span { font-size: 13px; color: var(--muted); }

/* panels */
.grid2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 460px), 1fr)); gap: 26px; align-items: start; }
.panel { background: var(--card); border: 1px solid var(--line); padding: 20px 22px; display: grid; gap: 14px; min-width: 0; }
.panel > header { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; }
.empty { color: var(--muted); font-size: 14px; margin: 0; }
.list { display: grid; }
.li { display: grid; grid-template-columns: auto 1fr auto; gap: 4px 12px; align-items: baseline; padding: 10px 0; border-top: 1px solid var(--line); }
.li:first-child { border-top: 0; }
.li .d { font-size: 12px; color: var(--muted); white-space: nowrap; min-width: 74px; }
.li .t { min-width: 0; }
.li .t small { display: block; color: var(--muted); font-size: 12px; }
.li .a { text-align: right; white-space: nowrap; }
.tag { display: inline-block; font-size: 10px; letter-spacing: .12em; text-transform: uppercase; padding: 1px 6px; border: 1px solid var(--line); color: var(--ink2); margin-right: 6px; vertical-align: 1px; }
.tag.h-jm87 { border-color: color-mix(in srgb, var(--warn) 50%, var(--line)); }
.tag.h-hamra { border-color: color-mix(in srgb, var(--accent) 60%, var(--line)); }
.tag.h-privat { border-color: var(--ink2); }
.tag.h-bil { border-color: color-mix(in srgb, var(--ink) 35%, var(--line)); }
.hbars { display: grid; gap: 8px; }
.hb { display: grid; grid-template-columns: minmax(110px, 38%) 1fr auto; gap: 10px; align-items: center; font-size: 13px; }
.hb .k { color: var(--ink2); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.hb .bar { height: 10px; background: var(--paper2); }
.hb .bar i { display: block; height: 100%; background: var(--ink); border-radius: 0 4px 4px 0; }
.hb:hover .bar i { background: var(--accent-ink); }
.hb .v { min-width: 84px; text-align: right; }
.loan { display: grid; gap: 4px; padding: 12px 0; border-bottom: 1px solid var(--line); }
.gauge { display: grid; gap: 6px; margin-top: 6px; }
.gbar { position: relative; height: 10px; background: var(--paper2); }
.gbar i { position: absolute; inset: 0 auto 0 0; background: var(--ink); border-radius: 0 4px 4px 0; }
.gbar b { position: absolute; top: -4px; bottom: -4px; width: 2px; background: var(--bad); }
.linefig { margin: 0; display: grid; gap: 4px; } .linefig svg { width: 100%; height: auto; }
ul.plan { margin: 0; padding-left: 18px; display: grid; gap: 8px; line-height: 1.5; }
.carnow .batt { position: relative; height: 6px; background: var(--paper2); margin-top: 6px; }
.carnow .batt i { position: absolute; inset: 0 auto 0 0; background: var(--good); border-radius: 0 3px 3px 0; }
.carnow .batt b { position: absolute; top: -3px; bottom: -3px; width: 2px; background: var(--ink2); }
.car3d { border: 1px solid var(--line); background: var(--card); }
.car3d iframe { display: block; width: 100%; height: min(62vh, 560px); border: 0; }
.carhero { display: flex; justify-content: space-between; align-items: flex-end; gap: 24px; flex-wrap: wrap; }
.plate { display: inline-flex; align-items: stretch; border: 2px solid var(--ink); border-radius: 6px; background: #fff; color: #111; overflow: hidden; height: 58px; box-shadow: 0 1px 0 var(--line); }
.plate .eu { background: #1f4ea3; color: #fff; width: 30px; display: grid; place-items: center; align-content: center; font: 600 13px/1 var(--f); padding: 4px 0; gap: 4px; }
.plate .eu i { color: #ffcc00; font-style: normal; font-size: 11px; }
.plate b { font: 500 34px/58px "DIN Alternate", "Arial Narrow", var(--f); letter-spacing: .08em; padding: 0 16px; }
details summary { cursor: pointer; font-size: 12px; letter-spacing: .12em; text-transform: uppercase; color: var(--ink2); padding: 6px 0; }
.tag.due { color: var(--warn); border-color: var(--warn); }
.tag.late { color: var(--bad); border-color: var(--bad); }
.insight { display: grid; gap: 10px; margin: 0; padding: 0; list-style: none; }
.insight li { display: grid; grid-template-columns: 22px 1fr; gap: 8px; font-size: 14.5px; line-height: 1.5; }
.insight li::before { content: '→'; color: var(--accent-ink); }
.chart .lab { font-size: 10.5px; fill: var(--muted); }

/* key figures */
.figs { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 0; border-top: 1px solid var(--line); border-left: 1px solid var(--line); }
.fig { padding: 14px 16px; border-right: 1px solid var(--line); border-bottom: 1px solid var(--line); display: grid; gap: 2px; min-width: 0; }
.fig b { font-family: var(--serif); font-weight: 400; font-size: 26px; line-height: 1.1; font-variant-numeric: tabular-nums; }
.fig span { font-size: 12px; color: var(--muted); }

/* house page */
.hhead { display: grid; gap: 24px; }
.hpics { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.hpics figure { margin: 0; display: grid; gap: 6px; min-width: 0; }
.hpics figcaption { font-size: 12px; color: var(--muted); display: flex; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
.hpics figcaption b { color: var(--ink); font-weight: 500; }
.sat { position: relative; aspect-ratio: 16 / 10; overflow: hidden; background: #2b2d2a; }
.sat img { width: 100%; height: 100%; object-fit: cover; display: block; transition: filter .6s; }
.sat svg { position: absolute; inset: 0; width: 100%; height: 100%; }
.sat.night img { filter: brightness(.38) saturate(.6) hue-rotate(195deg); }
.sat.low img { filter: sepia(.25) saturate(1.1) brightness(.92); }
.hhead .htext { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 8px 30px; align-items: end; }
.hhead .htext .row { justify-content: flex-end; }
@media (max-width: 760px) { .hpics { grid-template-columns: 1fr; } .hhead .htext { grid-template-columns: 1fr; } .hhead .htext .row { justify-content: flex-start; } }
.hhead .ph { aspect-ratio: 16 / 10; overflow: hidden; background: var(--paper2); }
.hhead img { width: 100%; height: 100%; object-fit: cover; display: block; }
@media (max-width: 860px) { .hhead { grid-template-columns: 1fr; } }
.facts { display: grid; grid-template-columns: 1fr 1fr; border-top: 1px solid var(--line); }
.facts div { padding: 10px 0; border-bottom: 1px solid var(--line); display: grid; gap: 1px; padding-right: 10px; }
.facts span { font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.tabs { display: flex; gap: 18px; border-bottom: 1px solid var(--line); overflow-x: auto; }
.tabs button { background: none; border: 0; padding: 12px 0; font-size: 11px; font-weight: 500; letter-spacing: .18em; text-transform: uppercase; border-bottom: 2px solid transparent; cursor: pointer; color: var(--ink2); white-space: nowrap; }
.tabs button[aria-pressed="true"] { border-color: var(--ink); color: var(--ink); }
.model { aspect-ratio: 16 / 9; width: 100%; border: 1px solid var(--line); background: var(--paper2); }
.model iframe { width: 100%; height: 100%; border: 0; display: block; }
@media (max-width: 640px) { .model { aspect-ratio: 3 / 4; } }
.guide { display: grid; gap: 18px; max-width: 70ch; }
.guide h3 { font-size: 22px; }
.guide p { margin: 4px 0 0; white-space: pre-line; }

/* tables */
.tw { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; font-size: 14px; }
th { text-align: left; font-size: 10.5px; font-weight: 500; letter-spacing: .16em; text-transform: uppercase; color: var(--muted); padding: 8px 10px 8px 0; border-bottom: 1px solid var(--line); white-space: nowrap; }
td { padding: 9px 10px 9px 0; border-bottom: 1px solid var(--line); vertical-align: top; }
td.r, th.r { text-align: right; }
tr.click { cursor: pointer; }
tr.click:hover td { background: color-mix(in srgb, var(--accent) 7%, transparent); }
td small { color: var(--muted); display: block; font-size: 12px; }

/* filters */
.filters { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
.filters select, .filters input { height: 38px; border: 1px solid var(--line); background: var(--card); padding: 0 10px; min-width: 0; }
.filters input { flex: 1 1 200px; }
.seg { display: inline-flex; border: 1px solid var(--line); }
.seg button { background: none; border: 0; padding: 8px 12px; font-size: 11px; letter-spacing: .12em; text-transform: uppercase; cursor: pointer; color: var(--ink2); }
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--paper); }

/* chart */
.chart { position: relative; }
.chart svg { width: 100%; height: auto; display: block; overflow: visible; }
.chart .tip { position: absolute; pointer-events: none; background: var(--ink); color: var(--paper); font-size: 12px; padding: 5px 8px; white-space: nowrap; transform: translate(-50%, -110%); opacity: 0; transition: opacity .12s; }
.chart .tip.on { opacity: 1; }

/* checkbox for tasks */
.chk { width: 20px; height: 20px; border: 1px solid var(--ink2); background: transparent; cursor: pointer; display: inline-grid; place-items: center; padding: 0; font-size: 13px; line-height: 1; }
.chk[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: #fff; }
.done .t { color: var(--muted); text-decoration: line-through; }

/* contacts */
.cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 260px), 1fr)); gap: 14px; }
.ccard { background: var(--card); border: 1px solid var(--line); padding: 14px 16px; display: grid; gap: 4px; min-width: 0; cursor: pointer; text-align: left; }
.ccard:hover { border-color: var(--ink2); }
.ccard b { font-weight: 500; }
.ccard .role { font-size: 12px; color: var(--muted); }
.ccard .ph { font-variant-numeric: tabular-nums; user-select: all; }
.ccard p { margin: 4px 0 0; font-size: 13px; color: var(--ink2); }

/* modal */
dialog { border: 1px solid var(--line); background: var(--card); color: var(--ink); padding: 0; width: min(560px, calc(100% - 32px)); max-height: calc(100% - 40px); }
dialog::backdrop { background: rgba(20, 18, 16, .45); }
.form { display: grid; gap: 14px; padding: 22px; }
.form label { display: grid; gap: 5px; font-size: 11px; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); }
.form input, .form select, .form textarea { height: 40px; border: 1px solid var(--line); background: var(--paper); padding: 0 10px; font-size: 15px; letter-spacing: 0; text-transform: none; color: var(--ink); width: 100%; }
.form textarea { height: 96px; padding: 8px 10px; resize: vertical; }
.form .two { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.form .actions { display: flex; justify-content: space-between; gap: 10px; flex-wrap: wrap; padding-top: 4px; }
.form .confirm { background: color-mix(in srgb, var(--bad) 10%, transparent); border: 1px solid var(--bad); padding: 10px 12px; font-size: 14px; display: grid; gap: 10px; }
.form .err { color: var(--bad); font-size: 13px; margin: 0; }
.drop { border: 1px dashed var(--ink2); padding: 16px; text-align: center; font-size: 14px; color: var(--ink2); cursor: pointer; }
.drop.over { background: color-mix(in srgb, var(--accent) 10%, transparent); }

.toast { position: fixed; left: 50%; bottom: calc(22px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--ink); color: var(--paper); padding: 10px 16px; font-size: 14px; opacity: 0; transition: opacity .2s; pointer-events: none; z-index: 50; }
.toast.on { opacity: 1; }
.note { font-size: 12.5px; color: var(--muted); margin: 0; }
@media (max-width: 640px) { .wrap { padding-inline: 16px; } header.top .wrap { gap: 14px; } .who { display: none; } .facts { grid-template-columns: 1fr; } .form .two { grid-template-columns: 1fr; } }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }

/* ---- portal shell (2026-10-20): side menu on wide screens, bottom bar on phones; one template for every home ---- */
.shell { display: grid; grid-template-columns: 236px minmax(0, 1fr); min-height: 100vh; }
.side { position: sticky; top: 0; height: 100vh; overflow-y: auto; border-right: 1px solid var(--line); padding: 26px 14px 20px; display: flex; flex-direction: column; gap: 22px; background: var(--paper); }
.side .brand { padding: 0 10px; font-size: 23px; }
.side .grp { display: grid; gap: 2px; }
.side .grp .eyebrow { padding: 0 10px 6px; font-size: 10px; }
.nl { display: flex; align-items: center; gap: 10px; padding: 8px 10px; text-decoration: none; font-size: 14.5px; font-weight: 400; color: var(--ink2); }
.nl:hover { background: var(--paper2); color: var(--ink); }
.nl[aria-current="page"] { background: var(--card); color: var(--ink); font-weight: 500; box-shadow: inset 2px 0 0 var(--ink); }
.nl .count { margin-left: auto; font-size: 11px; color: var(--muted); font-variant-numeric: tabular-nums; }
.nl .count.late { color: var(--bad); font-weight: 500; }
.searchbtn { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin: 0 4px; padding: 8px 10px; border: 1px solid var(--line); background: var(--card); cursor: pointer; font-size: 13px; color: var(--muted); }
.searchbtn:hover { border-color: var(--ink2); color: var(--ink); }
.searchbtn kbd { font: 11px var(--f); border: 1px solid var(--line); padding: 0 5px; }
.side .who { margin-top: auto; padding: 0 10px; white-space: normal; }
.shell > main.wrap { min-width: 0; max-width: 1180px; width: 100%; margin: 0 auto; padding: 38px 40px 90px; display: grid; grid-template-columns: minmax(0, 1fr); gap: 34px; align-content: start; }
.tabbar { display: none; }
.lead { margin: 0; color: var(--ink2); max-width: 66ch; font-size: 16px; }
/* object header + tabs: the same on Palma, Gotland, the car and Ekonomi */
.ohead { display: grid; gap: 18px; border-bottom: 1px solid var(--line); }
.ohead > div { display: grid; gap: 8px; }
.otabs { display: flex; gap: 26px; overflow-x: auto; scrollbar-width: none; margin-bottom: -1px; }
.otabs a { font-size: 11px; font-weight: 500; letter-spacing: .18em; text-transform: uppercase; text-decoration: none; padding: 12px 0 13px; border-bottom: 2px solid transparent; color: var(--ink2); white-space: nowrap; display: inline-flex; gap: 6px; align-items: baseline; }
.otabs a small { font-size: 10px; letter-spacing: 0; color: var(--muted); }
.otabs a[aria-current="page"] { border-color: var(--ink); color: var(--ink); }
a.fig { text-decoration: none; color: inherit; } a.fig:hover { background: var(--card); }
.kpis .fig b { font-size: 30px; }
.li.lk { text-decoration: none; color: inherit; } .li.lk:hover .t { color: var(--accent-ink); }
.ocards { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 280px), 1fr)); gap: 22px; }
.ocard { min-width: 0; grid-template-columns: minmax(0, 1fr); text-decoration: none; color: inherit; display: grid; background: var(--card); border: 1px solid var(--line); }
.ocard:hover { border-color: var(--ink2); }
.ocard .ph { aspect-ratio: 16 / 9; overflow: hidden; background: var(--paper2); }
.ocard .ph img { width: 100%; height: 100%; object-fit: cover; display: block; transition: transform .6s ease; }
.ocard:hover .ph img { transform: scale(1.025); }
.ocard .ob { padding: 16px 18px 18px; display: grid; grid-template-columns: minmax(0, 1fr); gap: 6px; }
.ocard .ol { display: flex; justify-content: space-between; gap: 12px; font-size: 13.5px; border-top: 1px solid var(--line); padding-top: 6px; }
.ocard .ol span { color: var(--muted); white-space: nowrap; } .ocard .ol b { font-weight: 400; text-align: right; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.bookcta { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 26px; background: var(--card); border: 1px solid var(--line); padding: 16px; }
.bookcta .ph { aspect-ratio: 16 / 10; overflow: hidden; } .bookcta img { width: 100%; height: 100%; object-fit: cover; display: block; }
.carhero { display: flex; justify-content: space-between; align-items: center; gap: 24px; flex-wrap: wrap; }
.hpics .ph { aspect-ratio: 16 / 10; overflow: hidden; background: var(--paper2); }
.hpics .ph img { width: 100%; height: 100%; object-fit: cover; display: block; }
.hpics figcaption a { color: var(--ink); }
/* search */
.form.search { gap: 10px; padding: 16px; }
.form.search input { height: 46px; font-size: 16px; }
.sres { display: grid; max-height: 60vh; overflow-y: auto; }
.sr { display: grid; grid-template-columns: auto 1fr; gap: 0 10px; align-items: baseline; padding: 9px 8px; text-decoration: none; color: var(--ink); border-top: 1px solid var(--line); }
.sr .tag { grid-row: span 2; align-self: center; }
.sr b { font-weight: 500; } .sr small { grid-column: 2; color: var(--muted); font-size: 12px; }

<script>
// ---------- theme: dark by default, light if chosen on this device ----------

// ---------- state ----------

const house = id => ({ ...DEFAULT_HOUSES[id], ...(S.houses[id] || {}) });

const fmtD = d => d ? new Date(d + 'T12:00').toLocaleDateString('sv-SE', { day: 'numeric', month: 'short', year: d.slice(0, 4) === today().slice(0, 4) ? undefined : 'numeric' }) : '';

// ---------- routing ----------
// One portal, four groups in the side menu: Översikt · Våra hem (Palma, Gotland, Bilen) · Pengar (Ekonomi) · Pärmen

const route = () => (location.hash.replace(/^#\/?/, '') || '').split('/');

  return { open: open.length, late, docs: S.docs.length, contacts: S.contacts.length };
}
function nav() {

  const grp = (title, items) => h('div', { class: 'grp' }, title ? h('span', { class: 'eyebrow' }, title) : null, items);
  const side = $('side');
  side.replaceChildren(...[
    h('div', { class: 'brandrow' }, h('a', { class: 'brand', href: '#/', 'aria-label': 'Westman – till översikten' }, 'WESTMAN'), h('button', { class: 'themebtn', type: 'button', onclick: toggleTheme, title: THEME() === 'dark' ? 'Byt till ljust läge' : 'Byt till mörkt läge', 'aria-label': THEME() === 'dark' ? 'Byt till ljust läge' : 'Byt till mörkt läge' }, THEME() === 'dark' ? '☀' : '☾')),
    FAM ? h('button', { class: 'searchbtn', type: 'button', onclick: openSearch }, h('span', {}, 'Sök i allt'), h('kbd', {}, '/')) : null,
    FAM ? [grp(null, [link('', 'Översikt', c.late ? h('span', { class: 'count late', title: c.late + ' försenade' }, c.late) : null)]),
      grp('Våra hem', [link('hus/jm87', 'Palma'), link('hus/hamra', 'Gotland'), link('bil', 'Bilen')]),
      grp('Pengar', [link('ekonomi', 'Ekonomi')]),
      grp('Pärmen', [link('underhall', 'Att göra', h('span', { class: 'count' + (c.late ? ' late' : '') }, c.open)), link('dokument', 'Papper', h('span', { class: 'count' }, c.docs)), link('kontakter', 'Kontakter', h('span', { class: 'count' }, c.contacts))])]
      : grp(null, [link('', 'Välkommen'), link('hus/jm87', 'Palma'), link('hus/hamra', 'Gotland')]),
    h('span', { class: 'who', id: 'who' }, ME ? (FAM ? ['Familjen · ', h('b', {}, ME)] : 'Gäst') : '')].flat(9).filter(Boolean));
  // phones: a bottom bar with the four places you go most, the rest behind "Mer"
  const tb = $('tabbar'), tab = (k, n) => h('a', { href: '#/' + k, 'aria-current': k === cur ? 'page' : null }, n);
  tb.replaceChildren(...(FAM ? [tab('', 'Översikt'), tab('hus/jm87', 'Palma'), tab('hus/hamra', 'Gotland'), tab('bil', 'Bilen'),
    h('button', { type: 'button', 'aria-current': ['ekonomi', 'underhall', 'dokument', 'kontakter'].includes(cur) ? 'page' : null, onclick: openMore }, 'Mer')]
    : [tab('', 'Välkommen'), tab('hus/jm87', 'Palma'), tab('hus/hamra', 'Gotland')]));
}
function openMore() {
  const dlg = $('dlg'), go = k => { dlg.close(); location.hash = '#/' + k; };
  dlg.replaceChildren(h('div', { class: 'form' }, h('h2', {}, 'Mer'),
    h('div', { class: 'binder' }, [['ekonomi', 'Ekonomi', 'förmögenhet, lån, aktier, räkningar'], ['underhall', 'Att göra', counts().open + ' öppna'], ['dokument', 'Papper', S.docs.length + ' dokument'], ['kontakter', 'Kontakter', S.contacts.length + ' kontakter']]
      .map(([k, n, s]) => h('a', { href: '#/' + k, onclick: e => { e.preventDefault(); go(k); } }, h('b', {}, n), h('span', {}, s), h('i', { 'aria-hidden': 'true' }, '→')))),
    h('div', { class: 'actions' }, h('button', { class: 'btn ghost', type: 'button', onclick: () => { dlg.close(); openSearch(); } }, 'Sök i allt'), h('button', { class: 'btn ghost', type: 'button', onclick: () => dlg.close() }, 'Stäng'))));
  dlg.showModal();
}
function render() {
  nav();
  const [p, a, b] = route();
  const app = $('app');
  const page = p === 'hus' && HOUSE_IDS.includes(a) ? objectPage(a, b || '')
    : p === 'bil' && FAM ? objectPage('bil', a || '')

    : p === 'forbrukning' && FAM ? economyPage('el')
    : p === 'dokument' && FAM ? docsPage()
    : p === 'underhall' && FAM ? tasksPage()
    : p === 'kontakter' && FAM ? contactsPage()
    : overview();
  app.replaceChildren(...[page].flat(9).filter(Boolean));
}
addEventListener('hashchange', () => { render(); scrollTo(0, 0); });
addEventListener('keydown', e => { if (FAM && (e.key === '/' || (e.key === 'k' && (e.metaKey || e.ctrlKey))) && !/INPUT|TEXTAREA|SELECT/.test(document.activeElement?.tagName) && !document.querySelector('dialog[open]')) { e.preventDefault(); openSearch(); } });

// ---------- search everything ----------
function searchIndex() {
  const out = [];
  const add = (kind, title, sub, href, text) => out.push({ kind, title, sub, href, text: `${title} ${sub || ''} ${text || ''}`.toLowerCase() });
  OBJ.forEach(i => add('Plats', objName(i), house(i).place, objHref(i)));
  S.tasks.filter(t => !t.done).forEach(t => add('Att göra', t.title, objName(t.house) + (t.date ? ' · ' + fmtD(t.date) : ''), OBJ.includes(t.house) ? objHref(t.house, 'att-gora') : '#/underhall', t.note));
  S.docs.forEach(d => add('Papper', d.title, (OBJ.includes(d.house) ? objName(d.house) : 'Privat') + (d.cat ? ' · ' + d.cat : ''), OBJ.includes(d.house) ? objHref(d.house, 'papper') : '#/dokument', `${d.note || ''} ${d.where || ''}`));
  S.contacts.forEach(c => add('Kontakt', c.name || c.company || c.role, [c.role, c.company !== c.name ? c.company : '', c.phone].filter(Boolean).join(' · '), OBJ.includes(c.house) ? objHref(c.house, 'kontakter') : '#/kontakter', c.note));
  S.contracts.forEach(c => add('Avtal', c.name, [c.provider, c.end ? (c.renew === 'auto' ? 'förnyas ' : 'slut ') + fmtD(c.end) : ''].filter(Boolean).join(' · '), '#/ekonomi/avtal', `${c.ref || ''} ${c.note || ''} ${c.how || ''}`));
  S.recurring.forEach(r => add(r.kind === 'income' ? 'Inkomst' : 'Kostnad', r.item, (OBJ.includes(r.house) ? objName(r.house) : 'Privat') + ' · ' + (r.amount === '' || r.amount == null ? 'belopp saknas' : money(+r.amount, curOf(r)) + ' ' + (PERN[r.per] || '')), OBJ.includes(r.house) ? objHref(r.house, 'ekonomi') : '#/ekonomi', `${r.cat || ''} ${r.note || ''}`));
  HOUSE_IDS.forEach(i => (S.guide[i]?.sections || []).forEach(s => add('Husbok', s.title, objName(i), objHref(i, 'husbok'), s.body)));
  const B = S.wealth.balance; if (B) { (B.loans || []).forEach(l => add('Lån', l.name, money(l.value, l.cur), '#/ekonomi', l.note)); (B.assets || []).forEach(a => add('Tillgång', a.name, money(a.value, a.cur), '#/ekonomi', a.note)); }
  (S.wealth.car?.facts || []).forEach(f => add('Bilen', f.k, f.v, objHref('bil'), f.v));
  return out;
}
function openSearch() {
  const dlg = $('dlg'), idx = searchIndex(), list = h('div', { class: 'sres', role: 'listbox' });
  const inp = h('input', { type: 'search', placeholder: 'Sök uppgifter, papper, kontakter, kostnader, husboken …', 'aria-label': 'Sök i allt', autocomplete: 'off' });
  let sel = 0, hits = [];
  const go = r => { dlg.close(); location.hash = r.href; };
  const draw = () => { const q = inp.value.trim().toLowerCase().split(/\s+/).filter(Boolean);
    hits = q.length ? idx.filter(r => q.every(w => r.text.includes(w))).slice(0, 40) : [];
    sel = Math.min(sel, Math.max(0, hits.length - 1));
    list.replaceChildren(...(q.length ? (hits.length ? hits.map((r, i) => h('a', { href: r.href, class: 'sr', 'aria-selected': String(i === sel), onclick: e => { e.preventDefault(); go(r); } }, h('span', { class: 'tag' }, r.kind), h('b', {}, r.title), r.sub ? h('small', {}, r.sub) : null)) : [h('p', { class: 'empty' }, 'Inget hittades.')])
      : [h('p', { class: 'note' }, 'Skriv t.ex. ”försäkring”, ”rörmokare”, ”IVTM” eller ”pool”. Pil upp/ner och Enter.')])); };

      if (file) { try { const r = await ASSETS.upload(file, file.type ? undefined : { type: 'application/pdf' }); asset = r.id; } catch (e) { toast(e.code === 'too_large' ? 'Filen är för stor (max 20 MB).' : e.code === 'unsupported_type' ? 'Filtypen stöds inte – använd PDF eller bild.' : 'Uppladdningen misslyckades.'); return false; } }
      return save('docs', d.id, { ...v, asset }, file ? 'Filen är uppladdad och sparad.' : 'Sparat.');
    }, d.id ? async () => { if (d.asset && ASSETS) { try { await ASSETS.delete(d.asset); } catch { } } return remove('docs', d.id); } : null, drop);
}

// ---------- boot (DEMO): example data instead of the database; changes live only until the page is reloaded ----------
const DEMO = JSON.parse(document.getElementById('demo-data').textContent);
const MAPS = ['houses', 'guide', 'purchase', 'meters', 'wealth'];
for (const k of Object.keys(S)) if (DEMO[k] != null) S[k] = MAPS.includes(k) ? DEMO[k] : DEMO[k].map(x => ({ ...x }));
let nid = 1;
DB = { collection: c => ({
  doc: id => ({
    set: async v => { if (MAPS.includes(c)) S[c] = { ...S[c], [id]: v }; else { const i = S[c].findIndex(x => x.id === id); const row = { id, ...v }; if (i < 0) S[c] = [...S[c], row]; else S[c] = S[c].map(x => x.id === id ? row : x); } setTimeout(render, 30); },
    delete: async () => { if (MAPS.includes(c)) { const o = { ...S[c] }; delete o[id]; S[c] = o; } else S[c] = S[c].filter(x => x.id !== id); setTimeout(render, 30); } }),
  add: async v => { const id = 'demo-' + nid++; S[c] = [...S[c], { id, ...v }]; setTimeout(render, 30); return { id }; } }) };
FAM = true; ASSETS = null; ME = 'du'; READY = true;
render();
</script>
