<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
</head>
<body>
<title>Hulehällar 418D</title>
<style>
/* Layout: a house book over a full-bleed 3D model. Identity taken from the house and the architect's dossier:
   lime-white and sand render, pale mint shutters, oak joinery, black steel frames, Century Gothic-style lettering. */
:root {
  --paper: #f8f5ef;          /* lime-white render */
  --beige: #ece3d5;          /* sand render */
  --ink: #2a2a26;            /* black steel frames */
  --muted: #77736a;
  --line: #e2dacb;
  --olive: #4c6b58;          /* shutter green, deep enough for text and links */
  --olive-ink: #ffffff;
  --shutter: #c9dccd;        /* the pale mint persianas */
  --shutter-edge: #9fbca8;
  --shutter-ink: #22372a;
  --oak: #b4844f;            /* oak doors, stair bench, fireplace panel */
  --card: rgba(250, 247, 241, 0.92);
  --label: rgba(252, 250, 245, 0.94);
  --sky: #dfe7ea;
  --f-display: "Questrial", "Century Gothic", "Avenir Next", "Futura", sans-serif;
  --f-head: "Jost", "Century Gothic", "Futura", "Avenir Next", sans-serif;
  --f-mono: "Jost", "Century Gothic", "Avenir Next", sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #1b1a17; --beige: #27241f; --ink: #eeeae2; --muted: #a8a397; --line: #3a362f;
    --olive: #a9c8b2; --olive-ink: #1b1a17; --shutter: #3d5446; --shutter-edge: #557060; --shutter-ink: #e4f0e7; --oak: #c99a65;
    --card: rgba(30, 28, 25, 0.9); --label: rgba(34, 32, 28, 0.92);
    --sky: #26303a; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #1b1a17; --beige: #27241f; --ink: #eeeae2; --muted: #a8a397; --line: #3a362f;
  --olive: #a9c8b2; --olive-ink: #1b1a17; --shutter: #3d5446; --shutter-edge: #557060; --shutter-ink: #e4f0e7; --oak: #c99a65;
  --card: rgba(30, 28, 25, 0.9); --label: rgba(34, 32, 28, 0.92);
  --sky: #26303a; color-scheme: dark;
}
html, body { height: 100%; }
body { background: var(--paper); color: var(--ink); font-family: var(--f-display); overflow: hidden; }
#stage { position: fixed; inset: 0; }
#stage canvas { display: block; }
#labels { position: fixed; inset: 0; pointer-events: none; }

.card {
  position: fixed; z-index: 2; left: 16px; top: calc(16px + env(safe-area-inset-top, 0px));
  width: min(300px, calc(100% - 32px)); padding: 16px 16px 14px;
  background: var(--card); border: 1px solid var(--line); border-radius: 10px;
  backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
  display: grid; gap: 12px;
}
.eyebrow { font-family: var(--f-mono); font-size: 10.5px; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }
h1 { margin: 2px 0 0; font-weight: 400; font-size: 24px; letter-spacing: .01em; text-wrap: balance; }
.floors { display: grid; grid-template-columns: repeat(5, 1fr); border: 1px solid var(--line); border-radius: 7px; overflow: hidden; }
.floors button {
  font: inherit; font-size: 12px; padding: 8px 2px; border: 0; background: transparent; color: var(--ink); cursor: pointer;
  border-left: 1px solid var(--line); line-height: 1.15;
}
.floors button:first-child { border-left: 0; }
.floors button small { display: block; font-family: var(--f-mono); font-size: 9.5px; color: var(--muted); margin-top: 2px; }
.floors button[aria-pressed="true"] { background: var(--olive); color: var(--olive-ink); }
.floors button[aria-pressed="true"] small { color: var(--olive-ink); opacity: .8; }
.floors button:focus-visible, .toggles input:focus-visible, .sun input:focus-visible, .sun select:focus-visible { outline: 2px solid var(--olive); outline-offset: 2px; }
.toggles { display: flex; flex-wrap: wrap; gap: 6px 16px; font-size: 13px; }
.toggles label { display: inline-flex; align-items: center; gap: 6px; cursor: pointer; }
.toggles input { accent-color: var(--olive); }
.facts { display: grid; grid-template-columns: 1fr auto; gap: 3px 12px; font-size: 12.5px; padding-top: 10px; border-top: 1px solid var(--line); }
.facts dt { color: var(--muted); }
.facts dd { margin: 0; font-family: var(--f-mono); font-size: 12px; font-variant-numeric: tabular-nums; text-align: right; }

.sun {
  position: fixed; z-index: 2; left: 50%; transform: translateX(-50%);
  bottom: calc(16px + env(safe-area-inset-bottom, 0px));
  width: min(520px, calc(100% - 32px)); padding: 10px 14px;
  background: var(--card); border: 1px solid var(--line); border-radius: 10px;
  backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
  display: grid; grid-template-columns: auto 1fr auto; align-items: center; gap: 12px; font-size: 13px;
}
.sun input[type=range] { width: 100%; accent-color: var(--olive); }
.sun select { font: inherit; font-size: 12.5px; background: transparent; color: var(--ink); border: 1px solid var(--line); border-radius: 6px; padding: 3px 4px; }
.sun output { font-family: var(--f-mono); font-size: 12px; font-variant-numeric: tabular-nums; min-width: 10.5em; text-align: right; color: var(--muted); }
.hint { position: fixed; z-index: 1; right: 16px; top: calc(16px + env(safe-area-inset-top, 0px)); font-family: var(--f-mono); font-size: 10.5px; color: var(--muted); text-align: right; line-height: 1.6; }

.lbl {
  font-family: var(--f-display); font-size: 11.5px; color: var(--ink); background: var(--label);
  border: 1px solid var(--line); border-radius: 5px; padding: 3px 7px; white-space: nowrap; text-align: center; line-height: 1.25;
}
.lbl.compass { font-family: var(--f-mono); font-weight: 500; border-radius: 50%; width: 26px; height: 26px; padding: 0; display: grid; place-items: center; color: var(--olive); }
.lbl span { display: block; font-family: var(--f-mono); font-size: 10px; color: var(--muted); }

@media (max-width: 640px) {
  .hint { display: none; }
  .card { padding: 12px; gap: 10px; }
  .facts { display: none; }
  h1 { font-size: 20px; }
  .sun { grid-template-columns: 1fr auto; }
  .sun .sun-name { display: none; }
}

/* ---------- top bar + house book ---------- */
:root { --bar: 52px; --hi: rgba(93, 107, 59, .12); --due: #b0412e; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --hi: rgba(169, 185, 124, .16); --due: #e58a73; } }
:root[data-theme="dark"] { --hi: rgba(169, 185, 124, .16); --due: #e58a73; }
.bar {
  position: fixed; z-index: 6; left: 0; right: 0; top: 0;
  padding: env(safe-area-inset-top, 0px) 16px 0; height: calc(var(--bar) + env(safe-area-inset-top, 0px));
  display: flex; align-items: center; gap: 14px;
  background: var(--card); border-bottom: 1px solid var(--line);
  backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
}
.bar .brand { font-size: 17px; white-space: nowrap; }
.bar .brand small { font-family: var(--f-mono); font-size: 10px; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); margin-left: 8px; }
.qwrap { position: relative; flex: 0 1 230px; min-width: 0; margin-left: auto; }
.qwrap input, .psearch input { width: 100%; font: inherit; font-size: 13.5px; padding: 7px 10px; border: 1px solid var(--line); border-radius: 7px; background: transparent; color: var(--ink); }
.qres { position: absolute; top: calc(100% + 6px); left: 0; width: min(380px, 90vw); background: var(--paper); border: 1px solid var(--line); border-radius: 8px; box-shadow: 0 8px 28px rgba(0,0,0,.12); padding: 4px; z-index: 9; }
.psearch { position: relative; display: none; }
.psearch .qres { width: 100%; }
.qres button { all: unset; box-sizing: border-box; display: grid; width: 100%; padding: 7px 10px; border-radius: 5px; cursor: pointer; }
.qres button:hover, .qres button:focus-visible { background: var(--hi); }
.qres b { font-weight: 400; font-size: 14px; }
.qres span { font-size: 12px; color: var(--muted); }
.modebtn { font: inherit; font-size: 12px; font-family: var(--f-mono); letter-spacing: .04em; padding: 5px 10px; border-radius: 99px; border: 1px solid var(--olive); background: var(--hi); color: var(--olive); cursor: pointer; white-space: nowrap; }
.modebtn[aria-pressed="false"] { background: transparent; color: var(--muted); border-color: var(--line); }
.tabs { display: flex; gap: 2px; min-width: 0; overflow-x: auto; scrollbar-width: none; }
.tabs::-webkit-scrollbar { display: none; }
.tabs button { font: inherit; font-size: 13.5px; border: 0; background: transparent; color: var(--ink); padding: 6px 11px; border-radius: 6px; cursor: pointer; white-space: nowrap; }
.tabs button:hover { background: var(--hi); }
.tabs button[aria-selected="true"] { background: var(--olive); color: var(--olive-ink); }
.tabs button:focus-visible, .book button:focus-visible, .book input:focus-visible, .book textarea:focus-visible, .book select:focus-visible, .drawer :focus-visible, .qwrap input:focus-visible { outline: 2px solid var(--olive); outline-offset: 2px; }
.card, .hint { top: calc(var(--bar) + 16px + env(safe-area-inset-top, 0px)); }
.lbl { pointer-events: auto; cursor: pointer; }
.lbl:hover, .lbl.has { border-color: var(--olive); }
body:not([data-tab="model"]) #labels { display: none; }

.book { position: fixed; z-index: 4; left: 0; right: 0; bottom: 0; top: calc(var(--bar) + env(safe-area-inset-top, 0px)); background: var(--paper); overflow: auto; }
.book[hidden] { display: none !important; }
.page { max-width: 1080px; margin: 0 auto; padding-block: 28px 80px; padding-inline: 16px; display: grid; gap: 32px; }
.page h2 { font-weight: 400; font-size: 30px; margin: 0; text-wrap: balance; }
.sec { display: grid; gap: 12px; min-width: 0; }
.sec h3 { font-family: var(--f-mono); font-size: 11px; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); margin: 0; font-weight: 500; }
.sechead { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.lead { font-size: 16px; line-height: 1.6; max-width: 68ch; margin: 0; }
.hero { display: grid; grid-template-columns: 1.5fr 1fr; gap: 10px; }
.hero img { width: 100%; height: 100%; max-height: 380px; aspect-ratio: 4 / 3; object-fit: cover; border-radius: 10px; cursor: zoom-in; display: block; background: var(--hi); }
.intro { gap: 14px; }
.keyfacts { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 1px; background: var(--line); border: 1px solid var(--line); border-radius: 10px; overflow: hidden; margin: 0; }
.keyfacts div { background: var(--paper); padding: 12px 14px; display: grid; gap: 3px; align-content: start; }
.keyfacts dt { font-size: 12px; color: var(--muted); }
.keyfacts dd { margin: 0; font-size: 14.5px; font-variant-numeric: tabular-nums; }
.keynums { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 10px; }
.keynum { border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; display: grid; gap: 4px; }
.keynum span { font-size: 12px; color: var(--muted); }
.keynum b { font-weight: 400; font-size: 15px; }
.phone { display: inline-flex; align-items: center; gap: 8px; font-family: var(--f-mono); font-size: 13px; white-space: nowrap; }
.phone a { color: var(--ink); text-decoration: none; }
.phone a:hover { color: var(--olive); text-decoration: underline; }
.copy { font: inherit; font-family: var(--f-display); font-size: 11px; padding: 2px 7px; border-radius: 5px; border: 1px solid var(--line); background: transparent; color: var(--muted); cursor: pointer; }
.uplist { list-style: none; margin: 0; padding: 0; display: grid; border-top: 1px solid var(--line); }
.uplist li { display: grid; grid-template-columns: 110px 1fr; gap: 12px; padding: 9px 2px; border-bottom: 1px solid var(--line); font-size: 14.5px; }
.uplist time { font-family: var(--f-mono); font-size: 12px; color: var(--muted); padding-top: 2px; }
.uplist .due time, .uptbl .due td:first-child { color: var(--due); }
.uplist .soon time { color: var(--olive); }
.cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 10px; }
.cardbtn { all: unset; box-sizing: border-box; cursor: pointer; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; display: grid; grid-template-rows: auto 1fr; background: var(--paper); }
.cardbtn:hover { border-color: var(--olive); }
.cardbtn:focus-visible { outline: 2px solid var(--olive); outline-offset: 2px; }
.cardbtn img, .cardbtn .ph { width: 100%; aspect-ratio: 16 / 10; object-fit: cover; display: block; background: var(--hi); }
.cardbtn .ph { display: grid; place-items: center; font-family: var(--f-mono); font-size: 20px; color: var(--olive); }
.cardbtn .ct { padding: 10px 12px 12px; display: grid; gap: 3px; align-content: start; }
.cardbtn b { font-weight: 400; font-size: 15px; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.cardbtn .ct span { font-size: 12.5px; color: var(--muted); line-height: 1.4; }
.howgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 12px; }
.howcard { border: 1px solid var(--line); border-radius: 10px; padding: 16px; display: grid; gap: 10px; align-content: start; }
.howtitle { all: unset; cursor: pointer; font-size: 19px; }
.howtitle:hover { color: var(--olive); }
.howcard dl { display: grid; grid-template-columns: 104px 1fr; gap: 7px 12px; margin: 0; font-size: 14px; line-height: 1.45; }
.howcard dt { color: var(--muted); font-size: 12.5px; padding-top: 1px; }
.howcard dd { margin: 0; }
.tbl { overflow-x: auto; border: 1px solid var(--line); border-radius: 10px; }
.tbl table { width: 100%; border-collapse: collapse; font-size: 14px; }
.tbl th { font-family: var(--f-mono); font-size: 10.5px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); text-align: left; font-weight: 500; padding: 9px 12px; border-bottom: 1px solid var(--line); white-space: nowrap; }
.tbl td { padding: 9px 12px; border-bottom: 1px solid var(--line); vertical-align: top; }
.tbl tbody tr:last-child td { border-bottom: 0; }
.tbl tfoot th { border-top: 1px solid var(--line); border-bottom: 0; font-family: var(--f-display); font-size: 14px; text-transform: none; letter-spacing: 0; color: var(--ink); }
.tbl .num { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
.tbl .sub { display: block; font-size: 12px; color: var(--muted); }
.tbl .notes { color: var(--muted); font-size: 13px; }
.tbl.edit td { padding: 5px 6px; }
.tbl.edit input:not([type=checkbox]), .tbl.edit select { font: inherit; font-size: 13px; width: 100%; min-width: 90px; padding: 5px 7px; border: 1px solid var(--line); border-radius: 5px; background: transparent; color: var(--ink); }
.todo { color: var(--muted); font-style: italic; }
.wbtn { font: inherit; font-size: 13px; padding: 7px 12px; border-radius: 7px; border: 1px solid var(--line); background: transparent; color: var(--ink); cursor: pointer; }
.wbtn.small { font-size: 12px; padding: 4px 9px; }
.wbtn.primary { background: var(--olive); color: var(--olive-ink); border-color: var(--olive); }
.wbtn.danger { color: var(--due); border-color: currentColor; }
.wbtn[aria-pressed="true"] { background: var(--olive); color: var(--olive-ink); border-color: var(--olive); }
.actions { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.note { font-size: 13px; color: var(--muted); margin: 0; }
.chip { font-family: var(--f-mono); font-size: 10px; letter-spacing: .06em; text-transform: uppercase; padding: 2px 8px; border-radius: 99px; background: var(--hi); color: var(--olive); }
.chip.lock { background: transparent; border: 1px solid var(--olive); }
.meta { font-family: var(--f-mono); font-size: 11px; color: var(--muted); display: flex; flex-wrap: wrap; gap: 6px 14px; align-items: center; }
.gallery { display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 10px; }
.gallery figure { margin: 0; display: grid; gap: 4px; align-content: start; }
.gallery img { width: 100%; aspect-ratio: 4 / 3; object-fit: cover; border-radius: 6px; background: var(--hi); cursor: zoom-in; display: block; }
.gallery figcaption { font-size: 12px; color: var(--muted); }
.gallery figcaption a { color: var(--olive); }
.wfacts { display: grid; grid-template-columns: minmax(120px, max-content) 1fr; gap: 6px 18px; font-size: 14px; border: 1px solid var(--line); border-radius: 8px; padding: 12px 14px; margin: 0; }
.wfacts dt { color: var(--muted); }
.wfacts dd { margin: 0; font-variant-numeric: tabular-nums; }
.wbody { font-size: 15px; line-height: 1.65; max-width: 68ch; }
.wbody h3 { font-weight: 400; font-size: 18px; margin: 1.1em 0 .3em; }
.wbody p { margin: 0 0 .8em; }
.wbody ul { margin: 0 0 .8em; padding-left: 1.2em; }
.wbody a { color: var(--olive); }

.scrim { position: fixed; inset: 0; z-index: 7; background: rgba(15, 18, 12, .35); }
.drawer { position: fixed; z-index: 8; right: 0; bottom: 0; top: 0; width: min(680px, 100%); background: var(--paper); border-left: 1px solid var(--line); overflow: auto; padding: calc(20px + env(safe-area-inset-top, 0px)) 24px 60px; box-shadow: -12px 0 40px rgba(0,0,0,.12); }
.drawer[hidden], .scrim[hidden] { display: none !important; }
.drawer-close { position: sticky; top: 0; float: right; z-index: 1; background: var(--paper); }
#drawer-body > * { display: grid; gap: 16px; }
.drawer h2 { font-weight: 400; font-size: 28px; margin: 0; text-wrap: balance; }
.wform { display: grid; gap: 12px; }
.wform label { display: grid; gap: 4px; font-size: 12.5px; color: var(--muted); }
.wform input, .wform textarea, .wform select { font: inherit; font-size: 14.5px; color: var(--ink); background: transparent; border: 1px solid var(--line); border-radius: 7px; padding: 8px 10px; }
.wform textarea { min-height: 70px; resize: vertical; line-height: 1.5; }
.wform .row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.wform details { border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; display: grid; gap: 10px; }
.wform summary { cursor: pointer; font-size: 13px; }

.planpanel { position: fixed; z-index: 3; right: 16px; top: calc(var(--bar) + 16px + env(safe-area-inset-top, 0px)); width: min(380px, calc(100% - 32px)); max-height: calc(100% - var(--bar) - 150px); overflow: auto; background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 12px; display: grid; gap: 8px; backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); }
.planpanel[hidden] { display: none !important; }
.planpanel .phd { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.planpanel b { font-weight: 400; font-size: 15px; }
.planpanel img { width: 100%; background: #fff; border-radius: 6px; cursor: zoom-in; display: block; }
.lightbox { position: fixed; inset: 0; z-index: 10; background: rgba(10, 12, 9, .9); display: grid; place-items: center; padding: 24px; }
.lightbox img { max-width: 100%; max-height: 84vh; border-radius: 6px; background: #fff; }
.lightbox p { color: #f0f0ea; font-size: 14px; text-align: center; margin: 10px 0 0; }
.lightbox button { position: absolute; top: calc(12px + env(safe-area-inset-top, 0px)); right: 16px; }
@media (max-width: 1180px) { .bar .brand small { display: none; } }
@media (max-width: 900px) {
  .qwrap { display: none; }
  .psearch { display: block; }
  .tabs { margin-left: auto; }
  .hero { grid-template-columns: 1fr; }
  .hero img:nth-child(2) { display: none; }
  .wform .row { grid-template-columns: 1fr; }
  .uplist li { grid-template-columns: 90px 1fr; }
}
@media (max-width: 560px) { .bar .brand { display: none; } .bar { gap: 8px; } .howgrid { grid-template-columns: 1fr; } }

/* ---------- house identity ---------- */
.plannote { flex-basis: 100%; margin: 2px 0 0; font-size: 12px; line-height: 1.45; color: var(--ink); max-width: 34ch; }
.navrow { display: flex; flex-wrap: wrap; gap: 4px; align-items: center; font-size: 12px; }
.navrow span { font-family: var(--f-head); font-size: 10.5px; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); margin-right: 4px; }
.navrow button, .roomchips button { font: inherit; font-family: var(--f-head); font-size: 12px; padding: 4px 9px; border: 1px solid var(--line); border-radius: 2px; background: transparent; color: var(--ink); cursor: pointer; }
.navrow button:hover, .roomchips button:hover { border-color: var(--oak); }
.roomchips { display: flex; flex-wrap: wrap; gap: 4px; }
.roomchips:empty { display: none; }
.roomchips button { background: var(--shutter); color: var(--shutter-ink); border-color: var(--shutter-edge); }
.roomchips .note { font-size: 12px; }
.gallery img[src$='.svg'], .cardbtn img[src$='.svg'] { object-fit: contain; background: #faf8f3; }
.planpick { font: inherit; font-family: var(--f-head); font-size: 12.5px; padding: 3px 6px; border: 1px solid var(--shutter-edge); border-radius: 2px; background: var(--shutter); color: var(--shutter-ink); }
.lbl.future { border-style: dashed; border-color: var(--olive); background: var(--shutter); color: var(--shutter-ink); }
.lbl.future span { color: var(--shutter-ink); opacity: .75; text-transform: uppercase; letter-spacing: .1em; font-size: 9px; }
.futuretoggle { color: var(--olive); }
/* one wide hero photo; all text sits below it */
.hero { display: block !important; height: auto !important; }
.hero img { width: 100%; height: auto !important; aspect-ratio: 2.04 / 1 !important; max-height: 560px; object-fit: cover; border-radius: 2px; display: block !important; }
@media (max-width: 900px) { .hero img { aspect-ratio: 16 / 10 !important; } }
.hero { grid-template-columns: 1.35fr 1fr; grid-template-rows: 1fr 1fr; height: clamp(320px, 52vw, 560px); }
.hero img { max-height: none; aspect-ratio: auto; height: 100%; border-radius: 2px; }
.hero img:first-child { grid-row: 1 / 3; }
@media (max-width: 900px) { .hero { grid-template-columns: 1fr; grid-template-rows: auto; height: auto; } .hero img { aspect-ratio: 4 / 3; } .hero img:nth-child(n+2) { display: none; } }
.bar { border-bottom: 1px solid var(--line); box-shadow: inset 0 -2px 0 0 var(--beige); }
.bar .brand { display: flex; align-items: baseline; gap: 10px; font-size: 15px; color: inherit; text-decoration: none; cursor: pointer; }
.bar .brand:hover .addr { color: var(--olive); }

.bar .brand small { font-family: var(--f-head); font-size: 11px; letter-spacing: .14em; margin: 0; }
.tabs button { font-family: var(--f-head); font-size: 13.5px; letter-spacing: .02em; border-radius: 0; padding: 8px 10px; box-shadow: inset 0 -2px 0 transparent; }
.tabs button:hover { background: transparent; box-shadow: inset 0 -2px 0 var(--line); }
.tabs button[aria-selected="true"] { background: transparent; color: var(--ink); box-shadow: inset 0 -2px 0 var(--oak); }
.modebtn { font-family: var(--f-head); letter-spacing: .08em; text-transform: uppercase; font-size: 11px; background: var(--shutter); color: var(--shutter-ink); border-color: var(--shutter-edge); }

.floors { border-radius: 2px; }

.floors button[aria-pressed="true"] small { color: var(--shutter-ink); }
.card, .sun, .planpanel, .keynum, .howcard, .tbl, .cardbtn, .keyfacts, .wfacts { border-radius: 3px; }
.page h2, .drawer h2 { font-family: var(--f-head); font-weight: 300; letter-spacing: .01em; }
.sec h3, .chip, .meta, .tbl th, .keyfacts dt, .gallery figcaption { font-family: var(--f-head); }
.sec h3 { font-size: 11.5px; letter-spacing: .18em; color: var(--olive); }
.sec h3::after { content: ""; display: block; width: 28px; height: 2px; background: var(--oak); margin-top: 7px; }
.chip { border-radius: 2px; background: var(--shutter); color: var(--shutter-ink); }
.cardbtn:hover, .keynum:hover { border-color: var(--oak); }
.cardbtn .ph { background: repeating-linear-gradient(180deg, var(--shutter) 0 9px, var(--shutter-edge) 9px 11px); color: var(--shutter-ink); }
.address { display: grid; gap: 6px; }

.address h2 { font-family: var(--f-head); font-weight: 300; font-size: clamp(38px, 7vw, 68px); line-height: 1; letter-spacing: .08em; text-transform: uppercase; }
.address .louvre { width: 112px; height: 16px; border-radius: 1px; background: repeating-linear-gradient(180deg, var(--shutter) 0 3px, var(--shutter-edge) 3px 4px); box-shadow: inset 4px 0 0 var(--shutter-edge), inset -4px 0 0 var(--shutter-edge); }
.lbl { border-radius: 2px; font-family: var(--f-head); }
.lbl.has { border-color: var(--shutter-edge); }
.howtitle { font-family: var(--f-head); font-weight: 400; }

.warn { margin: 0; background: var(--beige); border-left: 3px solid var(--oak); padding: 10px 14px; font-size: 14px; line-height: 1.5; max-width: 80ch; }
.utilgrid { display: grid; gap: 16px; }
.utilcard { border: 1px solid var(--line); border-radius: 3px; padding: 16px; display: grid; gap: 12px; min-width: 0; }
.utitle { font-family: var(--f-head); font-weight: 400; font-size: 19px; }
.ustats { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 1px; background: var(--line); border: 1px solid var(--line); margin: 0; }
.ustats div { background: var(--paper); padding: 10px 12px; display: grid; gap: 2px; }
.ustats dt { font-family: var(--f-head); font-size: 11.5px; color: var(--muted); }

.pbar { display: grid; grid-template-columns: 90px auto; align-items: center; gap: 8px; }

.acct { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 1px; background: var(--line); border: 1px solid var(--line); border-radius: 3px; }
.acct > * { background: var(--paper); padding: 12px 14px; display: grid; gap: 4px; align-content: start; }

.balrow { display: flex; gap: 6px; }
.balrow input { font: inherit; font-size: 15px; width: 100%; min-width: 0; padding: 5px 8px; border: 1px solid var(--line); border-radius: 2px; background: transparent; color: var(--ink); }
.alert { margin: 0; padding: 10px 14px; border-left: 3px solid var(--due); background: var(--beige); font-size: 14.5px; }
.okmsg { margin: 0; padding: 10px 14px; border-left: 3px solid var(--shutter-edge); background: var(--beige); font-size: 14.5px; }
.tbl tr.paid td { color: var(--muted); }
.tbl tr.due td:first-child { color: var(--due); }

.swatches { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 10px; }
.swatch { display: grid; grid-template-columns: 64px 1fr; gap: 12px; align-items: center; border: 1px solid var(--line); border-radius: 3px; padding: 8px; }
.swatch .chipc { width: 64px; height: 64px; border-radius: 2px; border: 1px solid rgba(0,0,0,.12); }
.swatch .chipc.empty { background: repeating-linear-gradient(45deg, var(--beige) 0 6px, var(--paper) 6px 12px); }
.swatch div { display: grid; gap: 2px; min-width: 0; }

.tl { list-style: none; margin: 0; padding: 0 0 0 18px; border-left: 2px solid var(--line); display: grid; gap: 14px; }
.tl li { position: relative; display: grid; gap: 4px; }
.tl li::before { content: ""; position: absolute; left: -25px; top: 5px; width: 10px; height: 10px; border-radius: 50%; background: var(--shutter); border: 2px solid var(--shutter-edge); }
.tl time { font-family: var(--f-head); font-size: 12.5px; color: var(--muted); }
.tl b { font-weight: 400; font-size: 16px; }
.tl p { margin: 0; font-size: 14.5px; line-height: 1.5; max-width: 70ch; }
.tl .chip { justify-self: start; }
.status-ok { color: var(--olive); } .status-due { color: var(--due); }
.checks { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; }
.checks label { display: flex; gap: 8px; align-items: flex-start; font-size: 15px; cursor: pointer; }
.checks .done { color: var(--muted); text-decoration: line-through; }
.checkgrid { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 16px; }
.askfab { position: fixed; z-index: 6; right: 16px; bottom: calc(16px + env(safe-area-inset-bottom, 0px)); font-family: var(--f-head); font-size: 14px; letter-spacing: .04em; padding: 11px 16px; border-radius: 22px; border: 1px solid var(--shutter-edge); background: var(--shutter); color: var(--shutter-ink); cursor: pointer; box-shadow: 0 4px 16px rgba(0,0,0,.15); }
.askfab[hidden], .askpanel[hidden] { display: none !important; }
.askpanel { position: fixed; z-index: 7; right: 16px; bottom: calc(16px + env(safe-area-inset-bottom, 0px)); width: min(440px, calc(100% - 32px)); max-height: min(72vh, 680px); display: flex; flex-direction: column; background: var(--paper); border: 1px solid var(--line); border-radius: 6px; box-shadow: 0 10px 40px rgba(0,0,0,.2); overflow: hidden; }
.askhead { display: flex; justify-content: space-between; align-items: center; gap: 8px; padding: 10px 12px; border-bottom: 1px solid var(--line); font-family: var(--f-head); }
.asklog { flex: 1; overflow: auto; padding: 12px; display: grid; gap: 10px; align-content: start; }
.askmsg { padding: 9px 12px; border-radius: 10px; font-size: 14.5px; line-height: 1.5; max-width: 92%; }
.askmsg.me { justify-self: end; background: var(--shutter); color: var(--shutter-ink); }
.askmsg.house { justify-self: start; background: var(--beige); }
.askmsg .wbody p { margin: 0 0 6px; } .askmsg .wbody ul { margin: 0; padding-left: 18px; }
.askform { display: flex; gap: 6px; padding: 10px; border-top: 1px solid var(--line); align-items: flex-end; }
.askform textarea { flex: 1; font: inherit; font-size: 15px; min-height: 40px; max-height: 120px; resize: vertical; padding: 8px 10px; border: 1px solid var(--line); border-radius: 6px; background: transparent; color: var(--ink); }
.askform button { min-width: 40px; min-height: 40px; }
.askform .mic[aria-pressed="true"] { background: var(--due); color: #fff; border-color: var(--due); }
.asknote { padding: 0 12px 8px; margin: 0; font-size: 12.5px; color: var(--muted); }
.walkrow { display: flex; gap: 6px; flex-wrap: wrap; }
/* the address, always visible at the top right, on every page and in the 3D views */
.addrtag { position: fixed; z-index: 6; right: 16px; top: calc(var(--bar) + 12px + env(safe-area-inset-top, 0px)); display: grid; gap: 1px; text-align: right; pointer-events: none;
  background: var(--card); border: 1px solid var(--line); border-radius: 3px; padding: 7px 11px; backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); }
.addrtag b { font-family: var(--f-head); font-weight: 500; font-size: 14px; letter-spacing: .16em; text-transform: uppercase; }
.addrtag span { font-family: var(--f-head); font-size: 11px; letter-spacing: .06em; color: var(--muted); }
.hint { top: calc(var(--bar) + 76px + env(safe-area-inset-top, 0px)) !important; }
.book .page { padding-top: 72px; }
@media (max-width: 640px) { .addrtag { padding: 5px 8px; } .addrtag span { display: none; } .addrtag b { font-size: 12px; } .book .page { padding-top: 56px; } body.walking .addrtag { top: calc(var(--bar) + 64px + env(safe-area-inset-top, 0px)); } }
.doorbtn { pointer-events: auto; font-family: var(--f-head); font-size: 12px; letter-spacing: .04em; padding: 5px 11px; border-radius: 14px; border: 1px solid var(--shutter-edge); background: var(--shutter); color: var(--shutter-ink); cursor: pointer; box-shadow: 0 2px 8px rgba(0,0,0,.25); }
.doorbtn[aria-pressed="true"] { background: var(--paper); color: var(--ink); border-color: var(--line); }
.floors button img { display: block; width: 100%; height: 40px; object-fit: cover; border-radius: 2px; margin: 0 0 4px; }
.roomchips { display: grid !important; grid-template-columns: repeat(auto-fill, minmax(104px, 1fr)); gap: 6px; }
.roomchips .note { grid-column: 1 / -1; }
.roomchips button.roomcard { display: grid; gap: 4px; padding: 4px; text-align: left; background: var(--paper); color: var(--ink); border-color: var(--line); }
.roomchips button.roomcard:hover { border-color: var(--shutter-edge); }
.roomchips button.roomcard img { width: 100%; height: 58px; object-fit: cover; border-radius: 2px; display: block; }
.roomchips button.roomcard span { font-size: 12px; padding: 0 2px 2px; }
.walkbar { position: fixed; z-index: 5; left: 50%; transform: translateX(-50%); top: calc(var(--bar) + 12px + env(safe-area-inset-top, 0px)); display: flex; gap: 10px; align-items: center; background: var(--card); border: 1px solid var(--line); border-radius: 22px; padding: 6px 8px 6px 14px; font-family: var(--f-head); font-size: 13px; backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); max-width: calc(100% - 32px); }
.walkbar[hidden], .joy[hidden] { display: none !important; }
.joy { position: fixed; z-index: 5; left: 24px; bottom: calc(96px + env(safe-area-inset-bottom, 0px)); width: 120px; height: 120px; border-radius: 50%; background: rgba(255,255,255,.35); border: 1px solid var(--line); touch-action: none; backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); }
.joy span { position: absolute; left: 50%; top: 50%; width: 48px; height: 48px; margin: -24px 0 0 -24px; border-radius: 50%; background: var(--shutter); border: 1px solid var(--shutter-edge); }
body.walking .card .toggles, body.walking .card .roomchips, body.walking .card .navrow, body.walking .hint, body.walking #walk-btn { display: none; }
body.walking #stage { cursor: grab; }
.places { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 10px; }
.place { border: 1px solid var(--line); border-radius: 3px; padding: 12px 14px; display: grid; gap: 6px; align-content: start; min-width: 0; }
.place b { font-family: var(--f-head); font-weight: 400; font-size: 16px; }
.place p { margin: 0; font-size: 14px; line-height: 1.5; }
.place a { font-family: var(--f-head); font-size: 13px; color: var(--olive); }
.viewpick { display: flex; border: 1px solid var(--shutter-edge); border-radius: 2px; overflow: hidden; flex: none; }
.viewpick button { font: inherit; font-family: var(--f-head); font-size: 11px; letter-spacing: .08em; text-transform: uppercase; padding: 5px 8px; border: 0; background: transparent; color: var(--ink); cursor: pointer; min-height: 28px; }
.viewpick button + button { border-left: 1px solid var(--shutter-edge); }
.viewpick button[aria-pressed="true"] { background: var(--shutter); color: var(--shutter-ink); }
.renttoggle { display: inline-flex; align-items: center; gap: 6px; font-family: var(--f-head); font-size: 14px; cursor: pointer; }
.ustats dd.neg { color: var(--due); }
.langpick { display: flex; border: 1px solid var(--shutter-edge); border-radius: 2px; overflow: hidden; flex: none; }
.langpick button { font: inherit; font-family: var(--f-head); font-size: 11px; letter-spacing: .08em; padding: 5px 7px; border: 0; background: transparent; color: var(--ink); cursor: pointer; min-height: 28px; }
.langpick button + button { border-left: 1px solid var(--shutter-edge); }
.langpick button[aria-pressed="true"] { background: var(--shutter); color: var(--shutter-ink); }

/* header menu: uppercase, quiet e-commerce style; language picker sits last, at the far right */
.tabs button { text-transform: uppercase; font-size: 11.5px; font-weight: 400; letter-spacing: .14em; color: var(--muted); padding: 8px 9px; }
.tabs button:hover { color: var(--ink); box-shadow: inset 0 -1px 0 var(--ink); }
.tabs button[aria-selected="true"] { color: var(--ink); font-weight: 500; box-shadow: inset 0 -1px 0 var(--ink); }
.bar > .langpick { margin-left: 4px; }
@media (max-width: 560px) { .bar .brand { display: none; } .bar > .langpick button { padding: 5px 6px; } .tabs button { padding: 8px 7px; letter-spacing: .1em; } }
/* ---------- premium layer: quiet estate-agent editorial. Warm stone paper, charcoal ink, thin tracked capitals,
   images without frames, hairline rules, square controls. Sage stays only as a small accent. ---------- */
:root {
  --paper: #efede9; --beige: #e5e1da; --ink: #3b3737; --muted: #857f78; --line: #d9d4cc;
  --olive: #3b3737; --olive-ink: #f7f5f1; --hi: rgba(59, 55, 55, .06);
  --shutter: #3b3737; --shutter-edge: #3b3737; --shutter-ink: #f7f5f1; --oak: #3b3737; --sage: #7d8f80;
  --card: rgba(239, 237, 233, .96); --label: rgba(247, 245, 241, .95);
  --f-display: "Jost", "Helvetica Neue", "Century Gothic", sans-serif;
  --f-head: "Jost", "Helvetica Neue", "Century Gothic", sans-serif;
  --f-mono: "Jost", "Helvetica Neue", sans-serif;
  --bar: 60px; --menu-ink: #111;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #1c1b1a; --beige: #262422; --ink: #ece8e2; --muted: #9c958c; --line: #34312e;
    --olive: #ece8e2; --olive-ink: #1c1b1a; --hi: rgba(236, 232, 226, .07);
    --shutter: #ece8e2; --shutter-edge: #ece8e2; --shutter-ink: #1c1b1a; --oak: #ece8e2; --sage: #a9bba9;
    --card: rgba(28, 27, 26, .95); --label: rgba(34, 32, 30, .94); --menu-ink: #f4f1ec;
  }
}
:root[data-theme="dark"] {
  --paper: #1c1b1a; --beige: #262422; --ink: #ece8e2; --muted: #9c958c; --line: #34312e;
  --olive: #ece8e2; --olive-ink: #1c1b1a; --hi: rgba(236, 232, 226, .07);
  --shutter: #ece8e2; --shutter-edge: #ece8e2; --shutter-ink: #1c1b1a; --oak: #ece8e2; --sage: #a9bba9;
  --card: rgba(28, 27, 26, .95); --label: rgba(34, 32, 30, .94); --menu-ink: #f4f1ec;
}
body { font-weight: 300; -webkit-font-smoothing: antialiased; letter-spacing: .005em; }
b, strong { font-weight: 400; }

/* header: wordmark left, tabs as tracked capitals, nothing boxed */
.bar { background: var(--card); box-shadow: none; border-bottom: 1px solid var(--line); gap: 22px; padding-inline: 24px; backdrop-filter: none; -webkit-backdrop-filter: none; }
.bar .brand .addr { font-weight: 500; font-size: 17px; letter-spacing: .3em; color: var(--menu-ink); }
.bar .brand small { font-weight: 500; color: var(--ink); font-size: 10px; letter-spacing: .24em; text-transform: uppercase; }
.tabs { gap: 0; }
.tabs button { font-weight: 500; font-size: 11px; letter-spacing: .16em; text-transform: uppercase; color: var(--menu-ink); padding: 10px 11px; }
.tabs button:hover { box-shadow: inset 0 -1px 0 var(--menu-ink); color: var(--menu-ink); }
.tabs button[aria-selected="true"] { color: var(--menu-ink); font-weight: 600; box-shadow: inset 0 -2px 0 var(--menu-ink); }
.qwrap input, .psearch input { border: 0; border-bottom: 1px solid var(--line); border-radius: 0; padding: 7px 2px; font-size: 13px; letter-spacing: .04em; }
.viewpick, .langpick { border: 0; gap: 2px; }
.viewpick button, .langpick button { font-weight: 500; font-size: 10.5px; letter-spacing: .18em; color: var(--menu-ink); opacity: .55; padding: 5px 6px; }
.viewpick button:hover, .langpick button:hover { opacity: 1; }
.viewpick button + button, .langpick button + button { border-left: 0; }
.viewpick button[aria-pressed="true"], .langpick button[aria-pressed="true"] { background: transparent; color: var(--menu-ink); opacity: 1; font-weight: 600; box-shadow: inset 0 -2px 0 var(--menu-ink); }

/* buttons: square, hairline, tracked capitals; primary is solid ink */
.wbtn, .modebtn, .copy, .navrow button, .planpick { font-weight: 400; font-size: 10.5px; letter-spacing: .2em; text-transform: uppercase; border-radius: 0; padding: 10px 18px; border: 1px solid var(--ink); background: transparent; color: var(--ink); }
.wbtn.small { font-size: 10px; padding: 7px 12px; }
.wbtn:hover, .navrow button:hover { background: var(--ink); color: var(--paper); border-color: var(--ink); }
.wbtn.primary, .wbtn[aria-pressed="true"] { background: var(--ink); color: var(--paper); border-color: var(--ink); }
.wbtn.primary:hover { background: transparent; color: var(--ink); }
.wbtn.danger { color: var(--due); border-color: var(--due); }
.navrow button { padding: 6px 10px; font-size: 9.5px; border-color: var(--line); }
.copy { padding: 3px 7px; font-size: 9px; border-color: var(--line); }

/* pages: wide margins, centred editorial headings */
.page { max-width: 1240px; padding-inline: clamp(16px, 4vw, 48px); gap: 64px; padding-bottom: 120px; }
.book .page { padding-top: 56px; }
.page > h2 { text-align: center; font-weight: 300; font-size: clamp(26px, 3.4vw, 40px); letter-spacing: .22em; text-transform: uppercase; line-height: 1.15; }
.page > h2 + .lead { margin-inline: auto; text-align: center; }
.drawer h2 { font-weight: 300; font-size: 30px; letter-spacing: .14em; text-transform: uppercase; line-height: 1.2; }
.sec { gap: 20px; }
.sec h3 { font-weight: 400; font-size: 11px; letter-spacing: .3em; color: var(--ink); }
.sec h3::after { width: 100%; height: 1px; background: var(--line); margin-top: 12px; }
.sechead { align-items: flex-end; }
.sechead h3 { flex: 1; }
.lead { font-size: 17px; line-height: 1.75; font-weight: 300; }
.wbody { font-size: 16px; line-height: 1.8; }
.wbody h3 { font-weight: 400; font-size: 13px; letter-spacing: .2em; text-transform: uppercase; margin-top: 1.8em; }
.wbody a, .place a, .gallery figcaption a { color: var(--ink); text-underline-offset: 3px; }
.eyebrow { font-weight: 400; letter-spacing: .3em; }

/* overview: a full-bleed hero with the address set over it */
.hero { position: relative; margin-inline: calc(50% - 50vw); margin-top: -56px; height: auto !important; }
.hero img { border-radius: 0 !important; max-height: none !important; height: min(78vh, 760px) !important; aspect-ratio: auto !important; }
.hero::after { content: ""; position: absolute; inset: 0; background: linear-gradient(180deg, rgba(20,18,16,.18) 0%, rgba(20,18,16,0) 35%, rgba(20,18,16,.38) 100%); pointer-events: none; }
.herocap { position: absolute; z-index: 1; left: 0; right: 0; bottom: clamp(28px, 7vh, 72px); text-align: center; color: #fff; pointer-events: none; display: grid; gap: 12px; padding: 0 16px; }
.herocap span { font-size: 11px; letter-spacing: .4em; text-transform: uppercase; font-weight: 400; }
.herocap b { font-weight: 200; font-size: clamp(40px, 8vw, 96px); letter-spacing: .24em; text-transform: uppercase; line-height: 1; margin-right: -.24em; }
@media (max-width: 900px) { .hero img { height: 62vh !important; aspect-ratio: auto !important; } }

<script type="application/json" id="book-snapshot">{"articles": [{"id": "overview", "title": "Huset i korthet", "cat": "Overview", "sort": 1, "room": "", "body": "Fritidshus på södra Gotland, ritat av arkitekt Jan Jansson och byggt 2010. Ett långt, smalt huvudhus i öst–västlig riktning med putsade lättbetongväggar och sadeltak i pannplåt, en svart träpanelad länga med gäststuga, snickarbod och garage, och ett attefallshus från 2022 med två sovrum och dusch. Mellan husen ligger en gård med kalkstenshällar, vintunnor och odlingslådor.\n\nI huvudhuset ligger arbets-/gästrummet och glasverandan i väster, allrummet med kök, matplats och öppen spis i mitten och dusch och sovrum i öster. Stora fasta fönster vetter mot söder och ett högt fönsterband mot norr.", "facts": [{"k": "Adress", "v": "Hamra Hulehällar 418D, 623 32 Burgsvik"}, {"k": "Fastighet", "v": "Hulehällar 1:26, Hamra"}, {"k": "Huvudhus", "v": "122,5 m², varav bostad 114 m²"}, {"k": "Glasveranda", "v": "7,5 m²"}, {"k": "Gäststuga, bod och garage", "v": "50 m²"}, {"k": "Attefallshus", "v": "30 m² (2022)"}, {"k": "Byggt", "v": "2010 (bygglov 2009)"}, {"k": "Uppvärmning", "v": "Bergvärme med radiatorer"}, {"k": "Vatten och avlopp", "v": "Kommunalt, via samfälligheten"}], "images": [{"src": "img/hero.jpg", "caption": "Gården med kalkstenshällarna och huvudhusets norrsida"}, {"src": "img/p-3608.jpg", "caption": "Gården mellan husen en sommarkväll"}, {"src": "img/p-5077.jpg", "caption": "Kalkstensplattan framför attefallshuset"}]}, {"id": "facades", "title": "Fasader och tak", "cat": "Facades & exterior", "sort": 2, "room": "", "body": "Huvudhuset har putsade fasader i ljust grått och ett sadeltak med 16° lutning i pannplåt, med ett brett träband under takfoten och synliga takbjälkar. Längan med gäststuga och garage och attefallshuset är klädda med svart liggande träpanel och har pulpettak i pannplåt.\n\nKulörerna kommer från arkitektens kulörbeskrivning: ytterdörrar, karmar och fönster NCS S 2502-Y, alla innertak S 2002-Y och väggar S 1502-Y.", "facts": [{"k": "Huvudhus", "v": "Lättbetong, puts"}, {"k": "Tak", "v": "Pannplåt, 16°"}, {"k": "Längan och attefallshuset", "v": "Svart liggande träpanel"}, {"k": "Fönster och dörrar", "v": "NCS S 2502-Y"}], "images": [{"src": "img/p-3817.jpg", "caption": "Norrsidan med fönsterbandet och vedstapeln"}]}, {"id": "garden", "title": "Gården och tomten", "cat": "Garden & plot", "sort": 3, "room": "", "body": "Tomten är ungefär 2 600 m² gotländsk alvarmark med enbuskar, tallar och rullstensgrus. Mellan huvudhuset och attefallshuset ligger en plan med oregelbundna kalkstenshällar på ungefär 52 m². På gården står vintunnor med havtorn och oliv, odlingslådor i grått trä och ett fikonträd.\n\nGrusuppfarten kommer från vägen i norr och slutar vid garageportarna. Söder om huset finns ett trädäck med skärmtak, en grillplats och studsmattan.", "facts": [{"k": "Tomt", "v": "ca 2 600 m² (ur situationsplanen)"}, {"k": "Kalkstensplatta", "v": "ca 52 m²"}, {"k": "Mark", "v": "Alvar, enbuskar, tall och rullstensgrus"}], "images": [{"src": "img/p-5079.jpg", "caption": "Kalkstenshällarna mot huvudhuset"}, {"src": "img/p-3816.jpg", "caption": "Fikonträdet vid plattan"}]}, {"id": "materials", "title": "Material och ytskikt", "cat": "Materials & finishes", "sort": 4, "room": "", "body": "Golven i huvudhuset är massiv såpad ekparkett. Badrummet har kalksten med elvärme och är helkaklat. Köket har laminatluckor och en rostfri bänk, och köksön har en skiva i såpad ask. Mellanväggarna är av trä och målade med slamfärg i de kulörer som kulörbeskrivningen anger, bland annat svart runt köket och grönt i rummet mot väster.", "facts": [{"k": "Golv", "v": "Massiv såpad ekparkett"}, {"k": "Badrum", "v": "Kalksten med elvärme, helkaklat"}, {"k": "Kök", "v": "Laminat, rostfri bänk"}, {"k": "Köksö", "v": "Såpad ask"}, {"k": "Fönster", "v": "Isolerglas / energiglas"}], "images": []}, {"id": "data", "title": "Mått och data", "cat": "Dimensions & data", "sort": 5, "room": "", "body": "Måtten kommer från arkitektens arbetsritningar (2010) och bygganmälan för attefallshuset (2022).", "facts": [{"k": "Huvudhus", "v": "21,18 × 5,38 m, rumshöjd 2,40 m"}, {"k": "Nockhöjd", "v": "ca 3,55 m, skorstenar 4,35 m"}, {"k": "Glasveranda", "v": "2,5 × 3,0 m"}, {"k": "Längan", "v": "12,5 × 4,0 m, 3,0 m mot söder och 2,5 m mot norr"}, {"k": "Attefallshus", "v": "9,0 × 3,3 m, pulpettak 11°, 3,45 / 2,45 m"}, {"k": "Arkitekt", "v": "Jan Jansson ark. (huvudhus och länga), Jörgen Åström ark. SAR/MSA (attefallshus)"}], "images": [{"src": "img/plan-huvudhus.jpg", "caption": "Arbetsritning A2-2: plan och sektioner"}]}, {"id": "r-arb", "title": "Arbets- och gästrum", "cat": "Rooms", "sort": 10, "room": "0:Study / guest room", "body": "Rummet mot väster, med fönster mot väster och söder och en glasdörr ut till glasverandan. Väggarna är målade i grönt, NCS S 3040-G30Y.", "facts": [{"k": "Golvyta", "v": "ca 11,6 m²"}, {"k": "Kulör", "v": "S 3040-G30Y"}], "images": []}, {"id": "r-veranda", "title": "Glasverandan", "cat": "Rooms", "sort": 11, "room": "0:Glazed veranda", "body": "Entré mot norr med dörr ut och glasdörr in till arbets-/gästrummet. Fem stora glas i karmar målade S 2502-Y. Golvet är kalksten.", "facts": [{"k": "Yta", "v": "7,5 m²"}, {"k": "Mått", "v": "2,5 × 3,0 m"}], "images": []}, {"id": "r-kok", "title": "Köket och allrummet", "cat": "Rooms", "sort": 12, "room": "0:Kitchen", "body": "Kök, matplats och vardagsrum är ett sammanhängande rum på ungefär 44 m². Köket har rostfri bänk med dubbeldisk och en köksö med skiva i såpad ask. Väggarna runt köket är svarta (S 9000-N). Matbordet står tvärs över rummet.", "facts": [{"k": "Allrummet", "v": "ca 44 m²"}, {"k": "Bänk", "v": "Rostfri"}, {"k": "Köksö", "v": "Såpad ask"}], "images": []}, {"id": "r-vard", "title": "Vardagsrummet", "cat": "Rooms", "sort": 13, "room": "0:Living room", "body": "Öppen spis i obehandlad stålplåt mitt i rummet, soffa mot den panelade väggen (S 6005-Y20R) och ett stort fönster mot söder.", "facts": [{"k": "Eldstad", "v": "Stålplåt 6 mm, 1600 × 670 × 1500"}], "images": []}, {"id": "r-dusch", "title": "Dusch och toalett", "cat": "Rooms", "sort": 14, "room": "0:Shower & WC", "body": "Helkaklat badrum med kalkstensgolv och elvärme. Porslin från Duravit (Happy D) och blandare från Hansgrohe Axor.", "facts": [{"k": "Golv", "v": "Kalksten, elvärme"}, {"k": "Handfat och toalett", "v": "Duravit Happy D"}, {"k": "Blandare", "v": "Hansgrohe Axor"}], "images": []}, {"id": "r-sov", "title": "Sovrummet", "cat": "Rooms", "sort": 15, "room": "0:Bedroom", "body": "Sovrummet mot öster med stort fönster mot söder och egen ytterdörr mot öster. Väggarna är målade i S 3030-Y20R.", "facts": [{"k": "Golvyta", "v": "ca 14,3 m²"}], "images": []}, {"id": "r-app", "title": "Tvätt och apparatrum", "cat": "Rooms", "sort": 16, "room": "0:Laundry & plant room", "body": "Tvättmaskin och varmvattenberedare. Här finns också bergvärmens utrustning.", "facts": [{"k": "Kulör", "v": "S 2030-R80B"}], "images": []}, {"id": "r-gast", "title": "Gäststugan", "cat": "Rooms", "sort": 20, "room": "1:Guest cottage", "body": "Gäststugan i längans västra ände har två sängar, glasdörr mot gården och ett högt fönster mot väster.", "facts": [{"k": "Golv", "v": "Trä"}], "images": []}, {"id": "r-bod", "title": "Snickarboden", "cat": "Rooms", "sort": 21, "room": "1:Workshop", "body": "Arbetsrum och bod med arbetsbänk, dörr och fönster mot gården.", "facts": [], "images": []}, {"id": "r-garage", "title": "Förråd och garage", "cat": "Rooms", "sort": 22, "room": "1:Storage & garage", "body": "Betonggolv och pardörrar mot öster där uppfarten slutar.", "facts": [{"k": "Golv", "v": "Betong"}], "images": []}, {"id": "r-att", "title": "Attefallshuset", "cat": "Rooms", "sort": 30, "room": "2:Bedroom north", "body": "Två sovrum och en toalett med dusch, var och en med egen glasad pardörr ut mot kalkstensplattan i väster. Byggt 2022 av Tallbergs El & Bygg AB.", "facts": [{"k": "Yta", "v": "30 m² BTA"}, {"k": "Tak", "v": "Pulpettak 11°, pannplåt"}, {"k": "Byggt av", "v": "Tallbergs El & Bygg AB, Gotlandstofta"}], "images": [{"src": "img/p-5078.jpg", "caption": "Dörrarna mot kalkstensplattan"}, {"src": "img/p-7790.jpg", "caption": "Attefallshuset från huvudhusets norrsida"}]}, {"id": "r-grill", "title": "Grillplatsen", "cat": "Rooms", "sort": 40, "room": "3:Grill place", "body": "Rund grusplan sydväst om huset med en svart Ofyr och en vedeldad pizzaugn på träbord.", "facts": [], "images": [{"src": "img/p-7603.jpg", "caption": "Pizzaugnen"}]}, {"id": "r-plank", "title": "Planken", "cat": "Rooms", "sort": 41, "room": "", "body": "Svarta plank med liggande brädor och stolpar som sticker upp en bit, som skärmen vid soptunnorna. Ett plank ramar in kalkstensplattan mot norr och ett stänger glipan mellan huvudhuset och attefallshuset.", "facts": [], "images": [{"src": "img/p-2922.jpg", "caption": "Förebilden: skärmen vid soptunnorna"}]}, {"id": "h-bergvarme", "title": "Bergvärme", "cat": "How it works", "sort": 50, "room": "0:Laundry & plant room", "body": "Huset värms med bergvärme och vattenburna radiatorer.", "how": {"what": "Bergvärmepump med vattenburen värme i radiatorer.", "where": "I tvätt- och apparatrummet.", "use": "Värmen styrs automatiskt. Huset står tomt större delen av året: höj värmen på hösten innan kylan kommer och ställ om till sommarläge på våren (påminnelserna ligger i husboken och hem-portalen).", "maintenance": "Se över trycket i värmesystemet och låt en installatör serva pumpen enligt tillverkarens intervall.", "call": "Rolfs Kyl o Maskin, 0498 24 87 00"}, "facts": [], "images": []}, {"id": "h-disk", "title": "Diskmaskinen", "cat": "How it works", "sort": 52, "room": "0:Kitchen", "body": "", "how": {"what": "Diskmaskin i köket.", "where": "I köksbänken.", "use": "Kör programmet ”Normalläge”: välj läget, tryck Start och stäng luckan. Blått ljus = du kan öppna och lägga in mer. Rött ljus = öppna inte. Grönt ljus = klart. De stora bruna tallrikarna står på högersidan.", "maintenance": "Rengör filtret ibland.", "call": ""}, "facts": [], "images": []}, {"id": "h-tv", "title": "Tv och Apple TV", "cat": "How it works", "sort": 53, "room": "0:Living room", "body": "", "how": {"what": "Tv utan kanaler – allt går via streamingtjänster på Apple TV.", "where": "I vardagsrummet.", "use": "Använd den lilla svarta Apple TV-fjärrkontrollen och starta med ”Menu”. SVT Play och andra appar är inloggade. Den andra kontrollen används bara för att stänga av tv:n. När ni är uppkopplade på wifi kan ni också spela musik i den gula högtalaren.", "maintenance": "", "call": ""}, "facts": [], "images": []}, {"id": "h-vatten", "title": "Vatten och avlopp", "cat": "How it works", "sort": 54, "room": "", "body": "", "how": {"what": "Kommunalt vatten och avlopp via samfällighetens gemensamma anläggning (GA6).", "where": "", "use": "", "maintenance": "Samfälligheten sköter ledningarna fram till tomten.", "call": "Rör / VVS: Sudrets Rör, Burgsvik, 0707 49 09 10"}, "facts": [], "images": []}, {"id": "s-valkommen", "title": "Välkommen till Hamra Hulehällar", "cat": "Your stay", "sort": 59, "room": "", "body": "Vad roligt att ni är här! Här är det ni behöver veta för att trivas under vistelsen. Koden till nyckeldosan och wifi-lösenordet får ni av oss i ett meddelande.", "facts": [], "images": []}, {"id": "s-sopor", "title": "Sopor", "cat": "Your stay", "sort": 60, "room": "", "body": "Vi har fått en ny sopsortering. Dela upp soporna efter markeringarna i soptunnan: hushållsavfall, matavfall, metall, kartong med mera. Tunnan töms bara varannan vecka, så den blir annars snabbt full. På väg in mot Burgsvik finns en återvinningsstation där man kan lämna det mesta.", "facts": [], "images": []}, {"id": "s-basvaror", "title": "Basvaror och ved", "cat": "Your stay", "sort": 61, "room": "", "body": "Använd gärna basvarorna i skafferierna – fyll på om något tar slut. Samma sak med veden: använder ni mycket, köp gärna mer på ICA.", "facts": [], "images": []}, {"id": "s-dorrar", "title": "Dörrarna", "cat": "Your stay", "sort": 62, "room": "", "body": "Det blåser en del. Ställ upp alla dörrar så att de inte står och slår – alla har hakar att ställa upp dem med.", "facts": [], "images": []}, {"id": "s-vattning", "title": "Vattning", "cat": "Your stay", "sort": 63, "room": "", "body": "Hjälp gärna till att vattna då och då, framför allt fikonträden, olivträdet och planteringslådorna.", "facts": [], "images": []}, {"id": "s-flugor", "title": "Flugor", "cat": "Your stay", "sort": 64, "room": "", "body": "Vi bor nära en bondgård, så det blir alltid lite flugor.\n- Flugsmällare hänger på kortsidan av köksön.\n- Flugremsor ligger i första lådan i köksön och kan sättas upp i taket.\n- Flugnät finns att sätta upp i dörrarna.\n\nLämna ingen mat framme längre än det behövs och torka av ytorna.", "facts": [], "images": []}, {"id": "s-morklagg", "title": "Mörkläggning i sovrummen", "cat": "Your stay", "sort": 65, "room": "", "body": "Båda sovrummen i huvudhuset har mörkläggningsgardiner som sätts upp varje kväll – haka bara i krokarna i taket.", "facts": [], "images": []}, {"id": "s-tvatt", "title": "Tvätt", "cat": "Your stay", "sort": 66, "room": "", "body": "Tvättmaskinen står i tvätt- och apparatrummet. Glasverandan är ett bra ställe att torka tvätten.", "facts": [], "images": []}, {"id": "s-leksaker", "title": "Leksaker", "cat": "Your stay", "sort": 67, "room": "", "body": "Det finns fler leksaker på översta hyllan i garaget – använd dem gärna.", "facts": [], "images": []}, {"id": "s-vinkyl", "title": "Vinkylen", "cat": "Your stay", "sort": 68, "room": "", "body": "Vi brukar använda vinkylen som kylskåp för grönsaker och frukt. Den nya vinkylen har fel mått och ska skickas tillbaka – använd den inte alls.", "facts": [], "images": []}, {"id": "s-badkar", "title": "Vedeldat badkar", "cat": "Your stay", "sort": 69, "room": "", "body": "Med vattenbristen på Gotland är det tyvärr svårt att använda det vedeldade badkaret.", "facts": [], "images": []}, {"id": "s-privat", "title": "Privat rum", "cat": "Your stay", "sort": 70, "room": "", "body": "Rummet längst till vänster i garagelängan är vårt förråd för privata saker. Låt det vara låst.", "facts": [], "images": []}, {"id": "s-samf", "title": "Samfälligheten", "cat": "Your stay", "sort": 71, "room": "", "body": "Huset ingår i Hulehällar samfällighetsförening med 28 fastigheter, som sköter vägar, vatten och avlopp, fiber och grönområden.", "facts": [], "images": []}, {"id": "h-ofyr", "title": "Ofyren", "cat": "How it works", "sort": 55, "room": "3:Grill place", "body": "", "how": {"what": "Rund grill där man steker på stålhällen runt elden.", "where": "På grillplatsen sydväst om huset.", "use": "Elda med ved. Skrapa rent hällen med skraporna i kökslådan och lite olivolja.", "maintenance": "", "call": ""}, "facts": [], "images": []}, {"id": "h-pizza", "title": "Pizzaugnen", "cat": "How it works", "sort": 56, "room": "3:Grill place", "body": "", "how": {"what": "Vedeldad pizzaugn på träbord.", "where": "På grillplatsen, bredvid Ofyren. Skorstenen förvaras i garaget.", "use": "Sätt på skorstenen. Elda i flera timmar innan ni bakar – ugnen ska upp i ca 400–500 grader för att pizzan ska bli bra.", "maintenance": "", "call": ""}, "facts": [], "images": []}, {"id": "h-eldstad", "title": "Öppna spisen", "cat": "How it works", "sort": 51, "room": "0:Living room", "body": "", "how": {"what": "Öppen spis i obehandlad stålplåt, ritad för huset.", "where": "Mitt i vardagsrummet.", "use": "Använd den gärna, men det blir snabbt väldigt varmt i huset. Elda långt inne i spisen så att röken inte kommer ut i rummet. Ryker det ändå in står spjällets reglage i av-läge – vrid det så att det står rakt, då är det öppet.", "maintenance": "Sotning enligt kommunens schema.", "call": ""}, "facts": [], "images": []}, {"id": "h-kolgrill", "title": "Kolgrillen", "cat": "How it works", "sort": 57, "room": "1:Storage & garage", "body": "", "how": {"what": "En mindre kolgrill.", "where":   "Your sketch: L-kitchen with pizza oven in the corner and a tiled bar table.": ["Din skiss: L-kök med pizzaugn i hörnet och ett kaklat barbord.", "Tu boceto: cocina en L con horno de pizza en la esquina y una mesa alta alicatada.", "Deine Skizze: L-Küche mit Pizzaofen in der Ecke und ein gefliester Bartisch."],
  "Architect B: straight kitchen with oven by the chimney, dining under a pergola, sea bar along the railing.": ["Arkitekt B: rakt kök med ugnen vid skorstenen, matplats under en pergola, havsbar längs räcket.", "Arquitecto B: cocina recta con el horno junto a la chimenea, comedor bajo una pérgola, barra al mar a lo largo de la barandilla.", "Architekt B: gerade Küche mit Ofen am Schornstein, Essplatz unter einer Pergola, Meeresbar am Geländer."],
  "C: kitchen on the south wall, standing ledge at the railing, lounge under a pergola, gym corner.": ["C: kök på södra muren, ståbar vid räcket, lounge under en pergola, gymhörna.", "C: cocina en el muro sur, barra de pie en la barandilla, chill-out bajo una pérgola, rincón de gimnasio.", "C: Küche an der Südwand, Stehtresen am Geländer, Lounge unter einer Pergola, Fitnessecke."],
  "D: long raised table from the cook to the sea, pergola over the middle, lounge by the south wall.": ["D: långt högt bord från köket mot havet, pergola över mitten, lounge vid södra muren.", "D: mesa alta larga desde la cocina hacia el mar, pérgola sobre el centro, chill-out junto al muro sur.", "D: lange hohe Tafel von der Küche zum Meer, Pergola über der Mitte, Lounge an der Südwand."],
  "Cooking along the stair-side wall, oven by the chimney, one long raised table running from the cook towards the sea under a pergola; lounge on the south wall; two olives frame the view.": ["Matlagning längs trapphusväggen, ugnen vid skorstenen, ett långt högt bord från köket mot havet under en pergola; lounge på södra muren; två olivträd ramar in utsikten.", "Cocina a lo largo de la pared del casetón, horno junto a la chimenea, una mesa alta larga desde la cocina hacia el mar bajo una pérgola; chill-out en el muro sur; dos olivos enmarcan las vistas.", "Kochen an der Treppenhauswand, Ofen am Schornstein, eine lange hohe Tafel von der Küche Richtung Meer unter einer Pergola; Lounge an der Südwand; zwei Olivenbäume rahmen die Aussicht."],
  "The cook works at an island facing the guests and the sea, with a raised ledge for three; a dining table for eight under the pergola; standing ledge at the railing; small lounge by the stairs.": ["Den som lagar mat står vid en köksö vänd mot gästerna och havet, med en hög bardel för tre; ett matbord för åtta under pergolan; ståbar vid räcket; liten lounge vid trappan.", "Quien cocina trabaja en una isla de cara a los invitados y al mar, con una barra alta para tres; una mesa de comedor para ocho bajo la pérgola; barra de pie en la barandilla; pequeño chill-out junto a la escalera.", "Gekocht wird an einer Insel mit Blick zu den Gästen und zum Meer, mit einem hohen Tresen für drei; ein Esstisch für acht unter der Pergola; Stehtresen am Geländer; kleine Lounge an der Treppe."],
  "Kitchen and oven on the south wall, in afternoon shade; a raised bar table in the middle, open at the sea end; a deep L-shaped lounge under a pergola in the sheltered north-east corner; herb garden by the stairs.": ["Kök och ugn på södra muren, i eftermiddagsskugga; ett högt barbord i mitten, öppet mot havet; en djup L-formad lounge under en pergola i det skyddade nordöstra hörnet; örtodling vid trappan.", "Cocina y horno en el muro sur, a la sombra por la tarde; una mesa alta en el centro, abierta hacia el mar; un chill-out profundo en L bajo una pérgola en la esquina noreste resguardada; huerto de hierbas junto a la escalera.", "Küche und Ofen an der Südwand, nachmittags im Schatten; ein hoher Bartisch in der Mitte, zum Meer hin offen; eine tiefe L-Lounge unter einer Pergola in der geschützten Nordostecke; Kräutergarten an der Treppe."],
  "Everyone faces the harbour: a long raised bar table parallel to the railing with five stools; kitchen and oven on the south wall; an outdoor living room with L-bench and armchairs under a pergola on the north side.": ["Alla tittar mot hamnen: ett långt högt barbord parallellt med räcket med fem pallar; kök och ugn på södra muren; ett uterum med L-soffa och fåtöljer under en pergola på norra sidan.", "Todos miran al puerto: una mesa alta larga paralela a la barandilla con cinco taburetes; cocina y horno en el muro sur; un salón exterior con banco en L y butacas bajo una pérgola en el lado norte.", "Alle schauen auf den Hafen: ein langer hoher Bartisch parallel zum Geländer mit fünf Hockern; Küche und Ofen an der Südwand; ein Outdoor-Wohnzimmer mit L-Bank und Sesseln unter einer Pergola auf der Nordseite."],
  "Gym in the north-west corner by the stairs, screened by a herb planter and an olive; kitchen and oven on the south wall; raised table in the middle; L-lounge in the north-east corner under a pergola.": ["Gym i nordvästra hörnet vid trappan, avskärmat av en örtlåda och ett olivträd; kök och ugn på södra muren; högt bord i mitten; L-lounge i nordöstra hörnet under en pergola.", "Gimnasio en la esquina noroeste junto a la escalera, protegido por una jardinera de hierbas y un olivo; cocina y horno en el muro sur; mesa alta en el centro; chill-out en L en la esquina noreste bajo una pérgola.", "Fitness in der Nordwestecke an der Treppe, abgeschirmt durch ein Kräuterbeet und einen Olivenbaum; Küche und Ofen an der Südwand; hoher Tisch in der Mitte; L-Lounge in der Nordostecke unter einer Pergola."],
  "A shallow gym strip along the stair-side wall (rack on the wall, bench, mat); kitchen and oven along the north parapet; dining for six under a pergola near the railing; small lounge and standing ledge on the south side.": ["En smal gymremsa längs trapphusväggen (ställ på väggen, bänk, matta); kök och ugn längs norra bröstningen; matplats för sex under en pergola nära räcket; liten lounge och ståbar på södra sidan.", "Una franja estrecha de gimnasio a lo largo de la pared del casetón (soporte en la pared, banco, esterilla); cocina y horno junto al peto norte; comedor para seis bajo una pérgola cerca de la barandilla; pequeño chill-out y barra de pie en el lado sur.", "Ein schmaler Fitnessstreifen an der Treppenhauswand (Ständer an der Wand, Bank, Matte); Küche und Ofen an der Nordbrüstung; Essplatz für sechs unter einer Pergola nahe dem Geländer; kleine Lounge und Stehtresen auf der Südseite."],
  "Train with the harbour in front of you: gym in the north-east corner behind a herb planter; cooking along the stair-side wall with the oven by the chimney; raised table in the middle and a lounge bench on the south wall, all under one pergola.": ["Träna med hamnen framför dig: gym i nordöstra hörnet bakom en örtlåda; matlagning längs trapphusväggen med ugnen vid skorstenen; högt bord i mitten och en loungebänk på södra muren, allt under en pergola.", "Entrena con el puerto delante: gimnasio en la esquina noreste detrás de una jardinera de hierbas; cocina a lo largo de la pared del casetón con el horno junto a la chimenea; mesa alta en el centro y un banco chill-out en el muro sur, todo bajo una pérgola.", "Trainieren mit Blick auf den Hafen: Fitness in der Nordostecke hinter einem Kräuterbeet; Kochen an der Treppenhauswand mit dem Ofen am Schornstein; hoher Tisch in der Mitte und eine Loungebank an der Südwand, alles unter einer Pergola."],
  "A compact gym along the north parapet by the stairs; kitchen and oven on the south wall; an L-lounge under a pergola in the middle-north; a long raised bar table along the railing where everyone faces the sea.": ["Ett kompakt gym längs norra bröstningen vid trappan; kök och ugn på södra muren; en L-lounge under en pergola i mitten mot norr; ett långt högt barbord längs räcket där alla tittar mot havet.", "Un gimnasio compacto junto al peto norte, al lado de la escalera; cocina y horno en el muro sur; un chill-out en L bajo una pérgola en el centro-norte; una mesa alta larga a lo largo de la barandilla donde todos miran al mar.", "Ein kompakter Fitnessbereich an der Nordbrüstung neben der Treppe; Küche und Ofen an der Südwand; eine L-Lounge unter einer Pergola in der nördlichen Mitte; ein langer hoher Bartisch am Geländer, an dem alle aufs Meer schauen."],
  "Both machines side by side under one 65 cm deep oak counter on the short wall: folding at 92 cm right on top of the machines, wall cabinets and a hanging rail above. Simplest and cheapest; the machines stay low.": ["Båda maskinerna sida vid sida under en 65 cm djup ekbänk på kortsidan: vik på 92 cm höjd direkt ovanpå maskinerna, väggskåp och en upphängningsstång ovanför. Enklast och billigast; maskinerna står lågt.", "Las dos máquinas una junto a otra bajo una encimera de roble de 65 cm en la pared corta: se dobla a 92 cm justo encima de las máquinas, con armarios altos y una barra para colgar encima. Lo más sencillo y barato; las máquinas quedan bajas.", "Beide Maschinen nebeneinander unter einer 65 cm tiefen Eichenplatte an der Schmalseite: Falten auf 92 cm direkt über den Maschinen, Hängeschränke und eine Kleiderstange darüber. Am einfachsten und günstigsten; die Maschinen bleiben niedrig."],
  "Machines stacked in the corner by the door wall, plinth drawer below for the basket; an L-shaped counter on the short wall and round the corner, 80 cm deep on the short wall, 65 cm where the door swings.": ["Maskinerna staplade i hörnet vid dörrväggen, sockellåda under för tvättkorgen; en L-formad bänk på kortsidan och runt hörnet, 80 cm djup på kortsidan, 65 cm där dörren slår.", "Máquinas apiladas en la esquina de la pared de la puerta, con un cajón zócalo debajo para el cesto; una encimera en L en la pared corta y doblando la esquina, de 80 cm en la pared corta y 65 cm donde abre la puerta.", "Maschinen gestapelt in der Ecke an der Türwand, Sockelschublade darunter für den Wäschekorb; eine L-förmige Arbeitsplatte an der Schmalseite und um die Ecke, 80 cm tief an der Schmalseite, 65 cm dort, wo die Tür aufschlägt."],
  "Recommended. Machines stacked in the door-wall corner of the short wall; one long counter down the whole party wall, 80 cm deep where you fold and 65 cm opposite the door so it opens fully; open unit over the hatch; storage and a 1.8 m hanging rail above.": ["Rekommenderas. Maskinerna staplade i hörnet vid dörrväggen på kortsidan; en lång bänk längs hela brandväggen, 80 cm djup där du viker och 65 cm mittemot dörren så att den kan öppnas helt; öppen hylla framför luckan; förvaring och en 1,8 m upphängningsstång ovanför.", "Recomendada. Máquinas apiladas en la esquina de la pared de la puerta, en la pared corta; una encimera larga a lo largo de toda la medianera, de 80 cm donde se dobla y 65 cm frente a la puerta para que abra del todo; módulo abierto delante de la trampilla; almacenaje y una barra de 1,8 m encima.", "Empfohlen. Maschinen gestapelt in der Türwand-Ecke der Schmalseite; eine lange Arbeitsplatte entlang der ganzen Brandwand, 80 cm tief zum Falten und 65 cm gegenüber der Tür, damit sie ganz aufgeht; offenes Fach vor der Klappe; Stauraum und eine 1,8 m lange Kleiderstange darüber."],

const BKEY = { main: 0, main_v: 0, gar: 1, att: 2 };
function mlabel(g, x, y, z, name, sub, info, cls = '') {

function search(q) {
  const words = q.trim().toLowerCase().split(/\s+/).filter(Boolean); if (!words.length) return [];
  const hit = s => words.every(w => s.includes(w)), res = [];
  for (const e of articles()) {
    const hay = [e.title, e.cat, e.body, ...(e.facts || []).flatMap(f => [f.k, f.v]), ...Object.values(e.how || {})].join(' ').toLowerCase();
    if (hit(hay)) res.push({ b: e.title, s: t(e.cat), go: () => openArticle(e.id), w: hit(e.title.toLowerCase()) ? 0 : 1 });
  }
  for (const r of places) if (hit([r.name, r.note, placeNote(r), r.group].join(' ').toLowerCase()))
    res.push({ b: r.name, s: t(r.group), go: () => showTab('guide'), w: hit(r.name.toLowerCase()) ? 0 : 1 });
  for (const r of contactRows()) if (hit(Object.values(r).join(' ').toLowerCase()))
    res.push({ b: r.name || r.company, s: [t(r.role || ''), r.phone].filter(Boolean).join(' · '), go: () => showTab('contacts'), w: 0 });
  return res.sort((a, b) => a.w - b.w).slice(0, 10);
}

      : [h('p', { class: 'note', style: 'padding:8px 10px' }, t('Nothing matches “{q}”.', { q: input.value.trim() }))]));
  };
