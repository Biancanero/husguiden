  // the listing agent: filled in per client; empty fields simply hide their buttons
  agent: { name: '', role: 'Listing agent', phone: '', whatsapp: '', email: '', photo: '' } };
// ---------- book a viewing: always one click away for buyers ----------
const SLOTS = ['Morning', 'Midday', 'Afternoon', 'Evening'];
function bookTexts() {
  for (const id of ['book-btn', 'book-bar']) document.getElementById(id).textContent = t('Book a viewing');
}
for (const id of ['book-btn', 'book-bar']) document.getElementById(id).addEventListener('click', () => openBooking());
function openBooking() {
  const A = AGENCY.agent, addr = 'Avinguda de Joan Miró 87 · El Terreno · Palma';
  const field = (label, input) => h('label', {}, t(label), input);
  const name = h('input', { type: 'text', autocomplete: 'name', required: true });
  const contact = h('input', { type: 'text', autocomplete: 'email', required: true, placeholder: t('Phone or e-mail') });
  const date = h('input', { type: 'date', min: todayISO() });
  const slot = h('select', {}, SLOTS.map(x => h('option', { value: x }, t(x))));
  const video = h('input', { type: 'checkbox' });
  const msg = h('textarea', { placeholder: t('Anything the agent should know? (optional)') });
  const status = h('p', { class: 'note', role: 'status' });
  const send = h('button', { class: 'wbtn primary', type: 'submit' }, t('Send request'));
  const text = () => `${t('Viewing request')}: Joan Miró 87\n${name.value} · ${contact.value}\n${date.value || t('Any day')} · ${t(slot.value)}${video.checked ? ' · ' + t('Video viewing') : ''}\n${msg.value}`;
  const links = () => h('div', { class: 'actions' },
    A.whatsapp ? h('a', { class: 'wbtn', href: 'https://wa.me/' + A.whatsapp.replace(/\D/g, '') + '?text=' + encodeURIComponent(text()), target: '_blank', rel: 'noopener' }, 'WhatsApp') : null,
    A.email ? h('a', { class: 'wbtn', href: 'mailto:' + A.email + '?subject=' + encodeURIComponent(t('Viewing request') + ': Joan Miró 87') + '&body=' + encodeURIComponent(text()) }, t('E-mail')) : null);
  const form = h('form', { class: 'wform', onsubmit: async ev => {
    ev.preventDefault();
    if (!name.value.trim() || !contact.value.trim()) { status.textContent = t('Please add your name and a phone number or e-mail.'); return; }
    send.disabled = true; status.textContent = t('Sending…');
    const lead = { name: name.value.trim(), contact: contact.value.trim(), date: date.value, slot: slot.value, video: video.checked, msg: msg.value.trim(), lang: LANG, at: new Date().toISOString() };
    let saved = false;
    try { if (dbRef && userNs) { const id = await userNs.id(); if (id) { await dbRef.doc('leads/' + id).set(lead); saved = true; } } } catch { }
    form.replaceChildren(h('div', { class: 'booked' },
      h('p', { class: 'lead' }, t(saved ? 'Thank you. Your request has reached the agent, who will confirm a time with you.' : 'Your request is ready. Send it to the agent with one of the buttons below.')),
      !saved && !A.whatsapp && !A.email ? h('p', { class: 'note' }, t('In this demo the agent\'s contact details are not filled in yet; for a real listing the request goes straight to them.')) : null,
      links()));
  } },
    h('div', { class: 'row' }, field('Your name', name), field('Phone or e-mail', contact)),
    h('div', { class: 'row' }, field('Preferred day', date), field('Time of day', slot)),
    h('label', { class: 'check' }, video, ' ', t('A video viewing suits me better')),
    field('Message', msg),
    h('div', { class: 'actions' }, send), status);
  const agentCard = h('div', { class: 'agentcard' },
    A.photo ? h('img', { src: A.photo, alt: '' }) : h('div', { class: 'agentmono', 'aria-hidden': 'true' }, (A.name || AGENCY.name).split(/\s+/).map(w => w[0]).join('').slice(0, 2)),
    h('div', {}, h('b', {}, A.name || AGENCY.name), h('span', {}, t(A.name ? A.role : 'Listing agent')),
      h('div', { class: 'actions' },
        A.phone ? h('a', { class: 'wbtn small', href: 'tel:' + A.phone.replace(/\s/g, '') }, t('Call')) : null,
        A.whatsapp ? h('a', { class: 'wbtn small', href: 'https://wa.me/' + A.whatsapp.replace(/\D/g, ''), target: '_blank', rel: 'noopener' }, 'WhatsApp') : null,
        A.email ? h('a', { class: 'wbtn small', href: 'mailto:' + A.email }, t('E-mail')) : null)));
  formOpen = true;
  openDrawer(h('div', { class: 'booking' }, h('span', { class: 'eyebrow' }, addr), h('h2', {}, t('Book a viewing')),
    h('p', { class: 'note' }, t('Choose a day and a time of day that suit you; the agent confirms the exact time.')), agentCard, form));
}
{ const el = document.getElementById('agency'); el.textContent = AGENCY.name; el.hidden = !AGENCY.name; }
document.getElementById('brand').addEventListener('click', ev => {
  ev.preventDefault(); walkStop(); closeDrawer(); planOpen = false; showTab('overview'); bookEl.scrollTop = 0; scrollTo(0, 0);
});
function refresh() { markLabels(); if (!editing && !formOpen) render(); }
function modeTexts() {
  viewBtns.forEach(b => { b.textContent = t(b.dataset.viewMode[0].toUpperCase() + b.dataset.viewMode.slice(1)); b.setAttribute('aria-pressed', String(b.dataset.viewMode === viewMode)); b.hidden = b.dataset.viewMode === 'owner' && !isOwner; });
  document.getElementById('view-pick').setAttribute('aria-label', t('View'));
  docsTab.textContent = t(ownerMode ? 'Money & docs' : 'Documents');
  timelineTab.textContent = t('Timeline'); adminTab.textContent = t('Owner');
  if (typeof askTexts === 'function') askTexts();
  prefsTexts();
  if (typeof bookTexts === 'function') bookTexts();
  guideTab.textContent = t('Live here');
}

// ---------- language ----------
// Static interface text is translated in place; the English original of each text node and attribute is remembered.
const staticText = new Map(), staticAttr = new Map();
function translateStatic() {
  const roots = [document.querySelector('header.bar'), document.querySelector('section.card'), document.querySelector('.sun'), document.querySelector('.hint'),
    document.getElementById('planpanel'), document.getElementById('drawer'), document.getElementById('stage')];
  const skip = '[data-dyn], #roomchips, .plannote, #plan-title, #s-out, .qres, #drawer-body';
  for (const root of roots) {
    if (!root) continue;
    const walk = document.createTreeWalker(root, NodeFilter.SHOW_TEXT);
    for (let n; (n = walk.nextNode());) {
      if (n.parentElement.closest(skip)) continue;
      if (!staticText.has(n)) staticText.set(n, n.textContent);
      const en = staticText.get(n), core = en.trim();
      if (core) n.textContent = en.replace(core, t(core));
    }
    for (const el of [root, ...root.querySelectorAll('[placeholder], [title], [aria-label], optgroup[label]')]) {
      if (el !== root && el.closest(skip)) continue;
      if (!staticAttr.has(el)) staticAttr.set(el, Object.fromEntries(['placeholder', 'title', 'aria-label', 'label'].filter(a => el.hasAttribute(a)).map(a => [a, el.getAttribute(a)])));
      for (const [a, v] of Object.entries(staticAttr.get(el))) el.setAttribute(a, t(v));
    }
  }
}
// header: who is looking and which language live together in one quiet menu at the right
function prefsTexts() {
  const lbl = document.getElementById('prefs-label'); if (!lbl) return;
  lbl.textContent = t(viewMode[0].toUpperCase() + viewMode.slice(1)) + ' · ' + LANG.toUpperCase();
  document.getElementById('prefs-h-view').textContent = t('Show the house as');
  document.getElementById('prefs-h-lang').textContent = t('Language');
  document.getElementById('prefs-btn').setAttribute('aria-label', t('View and language') + ': ' + lbl.textContent);
}
{
  const btn = document.getElementById('prefs-btn'), pop = document.getElementById('prefs-pop');
  const open = o => { pop.hidden = !o; btn.setAttribute('aria-expanded', String(o)); };
  btn.addEventListener('click', ev => { ev.stopPropagation(); open(pop.hidden); });
  document.addEventListener('click', ev => { if (!pop.hidden && !ev.target.closest('.prefs')) open(false); });
  document.addEventListener('keydown', ev => { if (ev.key === 'Escape' && !pop.hidden) { open(false); btn.focus(); } });
  pop.addEventListener('click', ev => { if (ev.target.closest('button')) setTimeout(() => open(false), 120); });
}
// 3D panel: floors, viewpoints and walking stay in front; layers and studies fold into "Display options"
{
  const tg = document.querySelector('.card .toggles'), d = document.createElement('details'), sm = document.createElement('summary');
  d.className = 'layers'; sm.textContent = 'Display options'; d.append(sm); tg.before(d); d.append(tg);
  const pt = document.getElementById('plan-toggle'); if (pt) document.querySelector('.card .walkrow').append(pt);
  // the gesture hints fade once someone has touched the model
  document.getElementById('stage').addEventListener('pointerdown', () => document.body.classList.add('hinted'), { once: true });
}
const langBtns = [...document.querySelectorAll('.langpick button')];
function setLang(l, save = true) {
  LANG = LANGS.includes(l) ? l : 'en';
  if (save) try { localStorage.setItem('hh-lang', LANG); } catch { }
  document.documentElement.lang = LANG;
  langBtns.forEach(b => b.setAttribute('aria-pressed', String(b.dataset.lang === LANG)));
  prefsTexts();
  document.querySelector('.langpick')?.setAttribute('aria-label', t('Language'));
  translateStatic(); modeTexts(); relabel3D(); walkTexts(); updateSun(); updateFuture(); updateRoomChips(); updatePlan();
  if (!drawer.hidden && !formOpen && openId) openArticle(openId);
  if (!editing && !formOpen) render();
}
langBtns.forEach(b => b.addEventListener('click', () => setLang(b.dataset.lang)));

// ---------- boot ----------
updatePlan(); showTab('overview'); markLabels(); setLang(LANG, false); setView(viewMode, false); showTab(startTab(viewMode));
(async () => {
  if (!window.claude?.use) return;
  claude.use('sample').then(fn => { sampleFn = fn; askFab.hidden = !fn || !askPanel.hidden; askTexts(); }).catch(() => { });
  const [db, u] = await Promise.all([claude.use('db'), claude.use('user')]);
  dbRef = db; userNs = u;
  isOwner = (await u?.isOwner()) ?? false;
  if (!db) return;
  canWrite = isOwner || (await u?.canEdit()) === true;
  if (isOwner) { setView(new URLSearchParams(location.search).get('view') || 'owner', false); showTab(startTab(viewMode)); }
  db.collection('wiki').onSnapshot(snap => {
    const docs = snap.docs.map(d => ({ id: d.id, ...d.data() }));
    const arts = docs.filter(d => !['contacts', 'places', 'timeline'].includes(d.id));
    if (arts.length) pub = arts.map(d => ({ ...d, _col: 'wiki' }));   // until the store has articles, keep the shipped snapshot
    const c = docs.find(d => d.id === 'contacts'); if (c) pubContacts = c.rows || [];
    const pl = docs.find(d => d.id === 'places'); if (pl) places = pl.rows || [];
    const tl = docs.find(d => d.id === 'timeline'); if (tl) pubTimeline = tl.rows || [];
    refresh();
  }, () => { });
  if (isOwner) db.collection('leads').onSnapshot(snap => { privLeads = snap.docs.map(d => ({ id: d.id, ...d.data() })); refresh(); }, () => { });
  if (isOwner) db.collection('private').onSnapshot(snap => {
    const docs = snap.docs.map(d => ({ id: d.id, ...d.data() }));
    for (const t of TABLES) privTables[t] = docs.find(d => d.id === t)?.rows || (privTables[t] ?? []);
    privUtil = docs.find(d => d.id === 'utilities') || null;
    privAccount = docs.find(d => d.id === 'account') || null;
    privRental = docs.find(d => d.id === 'rental') || null;
    priv = docs.filter(d => !TABLES.includes(d.id) && d.id !== 'utilities' && d.id !== 'account' && d.id !== 'rental').map(d => ({ ...d, _col: 'private' }));
    refresh();
  }, () => { });
})();
